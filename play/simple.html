<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>能量豆对战 · 简约版</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23e8b44a'/><circle cx='16' cy='16' r='7' fill='%231c1305'/></svg>">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0d0a11;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#0d0a11}
  .bar{
    position:fixed;top:10px;left:10px;right:10px;z-index:9;
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;
  }
  .bar a,.bar button{
    pointer-events:auto;
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 13px;border-radius:8px;
    font:500 12.5px/1 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:#ece6f2;background:rgba(20,16,25,.72);
    border:1px solid rgba(255,255,255,.12);
    backdrop-filter:blur(8px);
    opacity:.55;transition:opacity .18s,background .18s;
    cursor:pointer;text-decoration:none;
  }
  .bar a:hover,.bar button:hover{opacity:1;background:rgba(32,25,40,.92)}
  .bar .right{display:flex;gap:8px}
  @media(max-width:520px){ .bar{padding:0 2px} .bar a span{display:none} }
</style>
</head>
<body>
<iframe src="game.html" allow="fullscreen; autoplay; clipboard-write" title="能量豆对战"></iframe>

<div class="bar">
  <a href="../index.html">← <span>返回首页</span></a>
  <div class="right">
    <button id="fs" type="button">⛶ <span>全屏</span></button>
  </div>
</div>

<script>
document.getElementById("fs").addEventListener("click", function () {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    (el.requestFullscreen || el.webkitRequestFullscreen || function () {}).call(el);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || function () {}).call(document);
  }
});
</script>
</body>
</html>
