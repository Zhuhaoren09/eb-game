<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<title>能量豆对战 · 简约版</title>
<style>
	html, body {
		margin: 0;
		padding: 0;
		/* 手机上用 fixed 铺满，避免地址栏收起时高度跳动、以及 iOS 橡皮筋 */
		position: fixed;
		inset: 0;
		width: 100%;
		height: 100%;
		background: #ffffff;
		overflow: hidden;
		overscroll-behavior: none;
		-webkit-text-size-adjust: 100%;
	}
	body {
		display: flex;
		align-items: center;
		justify-content: center;
		font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
		-webkit-tap-highlight-color: transparent;
		-webkit-user-select: none;
		user-select: none;
		touch-action: none;
	}
	#game {
		display: block;
		background: #ffffff;
		touch-action: none;
	}
	/* 只有桌面「手机框」模式才加装饰：手机铺满时加了会在四周露出一圈灰边 */
	body.frame { background: #f2f3f5; }
	body.frame #game {
		border-radius: 8px;
		box-shadow: 0 10px 44px rgba(0, 0, 0, 0.14);
	}
	/* 安全区探针：JS 读不到 env()，把 inset 转成 padding 再量出来 */
	#__safe {
		position: fixed;
		top: 0;
		left: 0;
		width: 0;
		height: 0;
		padding-top: env(safe-area-inset-top, 0px);
		padding-bottom: env(safe-area-inset-bottom, 0px);
		visibility: hidden;
		pointer-events: none;
	}
	/* 启动失败时别白屏，把错误打出来 */
	#__boot {
		position: fixed;
		inset: 0;
		display: none;
		padding: 24px 18px;
		box-sizing: border-box;
		background: #ffffff;
		color: #111111;
		font: 14px/1.7 ui-monospace, Menlo, Consolas, monospace;
		white-space: pre-wrap;
		word-break: break-all;
		overflow: auto;
		z-index: 9;
		touch-action: pan-y;
	}
	#__boot b { display: block; margin-bottom: 10px; font-size: 16px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="__safe"></div>
<div id="__boot"></div>

<!-- 加载顺序不能变：样式 → 卡面 → 立方体 → 时间线 → 规则层 → AI → 牌桌 → 页面 → 启动 -->
<script>
/**
 * platform.js —— 宿主适配层（浏览器 / 微信小游戏）
 *
 * 这一层只处理「宿主差异」，游戏逻辑与画面完全不感知平台：
 *   · 画布：浏览器取 DOM canvas，小游戏取 wx.createCanvas()
 *   · 尺寸：宽度固定 750 逻辑像素，高度随屏幕伸缩（竖屏比例各异）
 *   · 安全区：刘海 / 底部小横条，换算成逻辑像素后交给 UI
 *   · 输入：pointer / touch 统一成 tap + dragStart/dragMove/dragEnd
 *   · 存储：小游戏补一个基于 wx.storage 的 localStorage 垫片（skills.js 依赖它存潜能）
 *   · 震动 / 分享 / 前后台切换
 *
 * 竖屏铺满策略：
 *   宽 750 恒定，scale = 画布宽 / 750 → 逻辑高 = 画布高 / scale。
 *   19.5:9 的手机逻辑高约 1620，4:3 平板不足 1334，此时改为按高适配并
 *   把 750 宽的内容列水平居中（ox），避免布局被压扁。
 */
(function (g) {
	'use strict';

	var DW = 750;
	var DESIGN_H = 1334;

	var IS_WX = (typeof wx !== 'undefined') && wx && typeof wx.createCanvas === 'function';

	var canvas = null;
	var ctx = null;
	var cssW = DW;
	var cssH = DESIGN_H;
	var dpr = 1;
	var scale = 1;
	var ox = 0;

	var view = { w: DW, h: DESIGN_H, safeTop: 0, safeBottom: 0 };

	var handlers = { tap: null, dragStart: null, dragMove: null, dragEnd: null, wheel: null };

	var loopFn = null;
	var running = false;
	var lastMs = 0;
	var downs = false;
	var canDrag = false;
	var moved = false;
	var downX = 0;
	var downY = 0;
	var downAt = 0;
	var storageKind = 'local';   /* local / session / memory / wx */
	var hidden = false;

	/* ---------------- 时钟 ---------------- */

	function now() {
		if (g.performance && typeof g.performance.now === 'function') {
			try { return g.performance.now(); } catch (e) { /* 继续降级 */ }
		}
		if (IS_WX && wx.getPerformance) {
			try { return wx.getPerformance().now(); } catch (e) { /* 继续降级 */ }
		}
		return Date.now();
	}

	/* ---------------- 系统信息 ---------------- */

	function sysInfo() {
		if (!IS_WX) return null;
		try {
			if (typeof wx.getWindowInfo === 'function') return wx.getWindowInfo();
		} catch (e) { /* 老版本基础库 */ }
		try { return wx.getSystemInfoSync(); } catch (e) { return null; }
	}

	/* ---------------- 画布与布局 ---------------- */

	function ensureCanvas() {
		if (canvas) return;
		if (IS_WX) {
			canvas = wx.createCanvas();
		} else {
			canvas = g.document.getElementById('game');
			if (!canvas) {
				canvas = g.document.createElement('canvas');
				canvas.id = 'game';
				g.document.body.appendChild(canvas);
			}
		}
		ctx = canvas.getContext('2d');
	}

	/**
	 * 浏览器在桌面（横向窗口）里给一个 750×1334 的「手机框」，
	 * 避免竖屏游戏铺满显示器后比例失真、按钮大到离谱。
	 */
	function stageSize() {
		var iw = g.innerWidth || DW;
		var ih = g.innerHeight || DESIGN_H;
		// 横着像桌面（宽高比 > 0.85）才画「手机框」；竖屏手机 / 平板一律铺满
		if (iw / ih > 0.85) {
			ih = Math.min(ih - 40, 880);
			iw = Math.round(ih * (DW / DESIGN_H));
			return [iw, ih, true];
		}
		return [iw, ih, false];
	}

	/**
	 * 浏览器的安全区（刘海 / 底部小横条）。
	 * CSS 里 env(safe-area-inset-*) 只有渲染引擎读得到，JS 拿不到，
	 * 所以放一个隐藏探针元素，把 inset 转成 padding 再用 getComputedStyle 读出来。
	 * 微信小程序走 sysInfo().safeArea，用不到这个。
	 */
	function readSafeInset() {
		var zero = [0, 0];
		if (!g.document || !g.getComputedStyle) return zero;
		var el = g.document.getElementById('__safe');
		if (!el) return zero;
		try {
			var cs = g.getComputedStyle(el);
			return [
				parseFloat(cs.paddingTop) || 0,
				parseFloat(cs.paddingBottom) || 0,
			];
		} catch (e) {
			return zero;
		}
	}

	function layout() {
		ensureCanvas();

		var safeTopCss = 0;
		var safeBottomCss = 0;

		if (IS_WX) {
			var info = sysInfo() || {};
			cssW = info.windowWidth || info.screenWidth || DW;
			cssH = info.windowHeight || info.screenHeight || DESIGN_H;
			dpr = info.pixelRatio || 1;
			canvas.width = Math.round(cssW * dpr);
			canvas.height = Math.round(cssH * dpr);
			var sa = info.safeArea;
			if (sa) {
				safeTopCss = sa.top || 0;
				safeBottomCss = Math.max(0, (info.screenHeight || cssH) - (sa.bottom || cssH));
			}
		} else {
			var sz = stageSize();
			cssW = sz[0];
			cssH = sz[1];
			dpr = g.devicePixelRatio || 1;
			canvas.style.width = cssW + 'px';
			canvas.style.height = cssH + 'px';
			canvas.width = Math.round(cssW * dpr);
			canvas.height = Math.round(cssH * dpr);

			var ins = readSafeInset();
			safeTopCss = ins[0];
			safeBottomCss = ins[1];

			// 桌面「手机框」模式才加圆角阴影；手机铺满时不能有，否则四周露灰边 = 那个「框」
			if (g.document && g.document.body && g.document.body.classList) {
				if (sz[2]) g.document.body.classList.add('frame');
				else g.document.body.classList.remove('frame');
			}
		}

		var cw = canvas.width;
		var ch = canvas.height;

		scale = cw / DW;
		if (ch / scale < DESIGN_H) scale = ch / DESIGN_H;

		// 短屏（平板 4:3）时按高适配，内容列水平居中
		ox = (cw / scale - DW) * 0.5;

		// CSS 像素 → 逻辑像素：宽度方向 750 对应 cssW
		var k = DW / cssW;

		view.w = DW;
		view.h = ch / scale;
		view.safeTop = Math.round(safeTopCss * k);
		view.safeBottom = Math.round(safeBottomCss * k);

		return view;
	}

	/** 每帧开头：清底色 + 应用变换。返回 ctx。 */
	function beginFrame() {
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.fillStyle = '#ffffff';
		ctx.fillRect(0, 0, canvas.width, canvas.height);
		ctx.setTransform(scale, 0, 0, scale, ox, 0);
		return ctx;
	}

	/* ---------------- 输入 ---------------- */

	function toLogical(cx, cy) {
		var bx;
		var by;
		if (IS_WX || !canvas.getBoundingClientRect) {
			bx = cx * dpr;
			by = cy * dpr;
		} else {
			var r = canvas.getBoundingClientRect();
			bx = (cx - r.left) * (canvas.width / Math.max(r.width, 1));
			by = (cy - r.top) * (canvas.height / Math.max(r.height, 1));
		}
		return [(bx - ox) / scale, by / scale];
	}

	function onDown(cx, cy) {
		var p = toLogical(cx, cy);
		downs = true;
		moved = false;
		downX = p[0];
		downY = p[1];
		downAt = now();
		canDrag = handlers.dragStart ? !!handlers.dragStart(p[0], p[1]) : false;
	}

	function onMove(cx, cy) {
		if (!downs) return;
		var p = toLogical(cx, cy);
		if (!moved) {
			var dx = Math.abs(p[0] - downX);
			var dy = Math.abs(p[1] - downY);
			// 死区只用来挡点击误触：竖向为主的手势（滑列表）判定放宽，
			// 免得手指一抖就既不算点击也不算滚动。
			var dead = (dy > dx * 1.2) ? 6 : 10;
			if (dx + dy < dead) return;
			moved = true;
			// 手指先动了才判定为拖拽：down 时如果目标区域不支持拖动，这里也不给
			if (!canDrag) return;
		}
		if (handlers.dragMove) handlers.dragMove(p[0], p[1]);
	}

	function onUp(cx, cy) {
		if (!downs) return;
		downs = false;
		var p = toLogical(cx, cy);
		if (handlers.dragEnd) handlers.dragEnd();
		// 拖拽结束后的那一下抬手不再算点击；同时拦掉长按误触
		if (!moved && now() - downAt < 900 && handlers.tap) {
			handlers.tap(p[0], p[1]);
		}
		moved = false;
		canDrag = false;
	}

	function onCancel() {
		downs = false;
		moved = false;
		canDrag = false;
		if (handlers.dragEnd) handlers.dragEnd();
	}

	function bindInput() {
		if (IS_WX) {
			wx.onTouchStart(function (e) {
				var t = e.touches && e.touches[0];
				if (t) onDown(t.clientX, t.clientY);
			});
			wx.onTouchMove(function (e) {
				var t = e.touches && e.touches[0];
				if (t) onMove(t.clientX, t.clientY);
			});
			wx.onTouchEnd(function (e) {
				var t = (e.changedTouches && e.changedTouches[0]) || (e.touches && e.touches[0]);
				if (t) onUp(t.clientX, t.clientY); else onCancel();
			});
			wx.onTouchCancel(function () { onCancel(); });
			return;
		}

		// 桌面滚轮：交给页面自己决定滚哪里（潜能列表）。手机上没有这个事件。
		if (canvas.addEventListener) {
			canvas.addEventListener('wheel', function (e) {
				if (!handlers.wheel) return;
				var d = (e.deltaMode === 1) ? e.deltaY * 16 : e.deltaY;
				if (handlers.wheel(d)) { e.preventDefault(); }
			}, { passive: false });
		}

		if (g.PointerEvent) {
			canvas.addEventListener('pointerdown', function (e) {
				if (e.pointerType === 'mouse' && e.button !== 0) return;
				onDown(e.clientX, e.clientY);
			});
			canvas.addEventListener('pointermove', function (e) { onMove(e.clientX, e.clientY); });
			canvas.addEventListener('pointerup', function (e) { onUp(e.clientX, e.clientY); });
			canvas.addEventListener('pointercancel', function () { onCancel(); });
		} else {
			canvas.addEventListener('touchstart', function (e) {
				if (e.touches && e.touches.length) onDown(e.touches[0].clientX, e.touches[0].clientY);
			}, { passive: true });
			canvas.addEventListener('touchmove', function (e) {
				if (e.touches && e.touches.length) onMove(e.touches[0].clientX, e.touches[0].clientY);
			}, { passive: true });
			canvas.addEventListener('touchend', function (e) {
				if (e.changedTouches && e.changedTouches.length) {
					onUp(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
				} else onCancel();
			});
			canvas.addEventListener('mousedown', function (e) { onDown(e.clientX, e.clientY); });
			canvas.addEventListener('mousemove', function (e) { onMove(e.clientX, e.clientY); });
			canvas.addEventListener('mouseup', function (e) { onUp(e.clientX, e.clientY); });
		}
	}

	/* ---------------- 存储 ---------------- */

	/**
	 * 存档垫片。
	 *
	 * 浏览器里的 localStorage 在三种情况下「看着在、其实用不了」：
	 *   file:// 打开、隐私/无痕模式、第三方 cookie 被禁 —— 访问它直接抛 SecurityError。
	 * 潜能选择存在它里面，于是「每次打开都重置」，这就是浏览器里说的存不住。
	 *
	 * 这里探测一次：能用就用；不能用就退到 sessionStorage（关掉页面就没了，
	 * 但至少刷新还在）；再不行就放内存（这一局内是稳的）。
	 * 降级时会**覆盖全局 localStorage**，因为 skills.js 是直接用全局 localStorage 的。
	 */
	function usableStorage(s) {
		if (!s) return false;
		try {
			var k = '__ebg_probe__';
			s.setItem(k, '1');
			var v = s.getItem(k);
			s.removeItem(k);
			return v === '1';
		} catch (e) { return false; }
	}

	function memStore() {
		var mem = {};
		return {
			getItem: function (k) {
				return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null;
			},
			setItem: function (k, v) { mem[k] = String(v); },
			removeItem: function (k) { delete mem[k]; },
		};
	}

	function installStorage() {
		/* 小游戏：没有 localStorage，用 wx.storage 当后端 */
		if (IS_WX) {
			storageKind = 'wx';
			var wxStore = {
				getItem: function (k) {
					try {
						var v = wx.getStorageSync(k);
						if (v === '' || v === null || v === undefined) return null;
						return typeof v === 'string' ? v : JSON.stringify(v);
					} catch (e) { return null; }
				},
				setItem: function (k, v) {
					try { wx.setStorageSync(k, String(v)); } catch (e) { /* 空间不足等，忽略 */ }
				},
				removeItem: function (k) {
					try { wx.removeStorageSync(k); } catch (e) { /* 忽略 */ }
				},
			};
			try { g.localStorage = wxStore; } catch (e) { /* 忽略 */ }
			return;
		}

		var ls = null;
		try { ls = g.localStorage; } catch (e) { ls = null; }
		if (usableStorage(ls)) { storageKind = 'local'; return; }

		var ss = null;
		try { ss = g.sessionStorage; } catch (e2) { ss = null; }
		var kind = 'memory';
		var back = memStore();
		if (usableStorage(ss)) { kind = 'session'; back = ss; }
		storageKind = kind;

		var shim = {
			getItem: function (k) {
				try { var v = back.getItem(k); return v === undefined ? null : v; }
				catch (e) { return null; }
			},
			setItem: function (k, v) { try { back.setItem(k, String(v)); } catch (e3) { /* 忽略 */ } },
			removeItem: function (k) { try { back.removeItem(k); } catch (e4) { /* 忽略 */ } },
		};

		/* localStorage 在 Window 上是只读访问器，直接赋值在严格模式下会抛，
		 * 所以先试 defineProperty 遮住原型上的那个。 */
		try {
			Object.defineProperty(g, 'localStorage', { value: shim, configurable: true, writable: true });
		} catch (e) {
			try { g.localStorage = shim; } catch (e2) { /* 某些宿主不允许覆盖 */ }
		}
		try {
			if (!usableStorage(g.sessionStorage)) {
				Object.defineProperty(g, 'sessionStorage', { value: shim, configurable: true, writable: true });
			}
		} catch (e3) { /* 忽略 */ }
	}

	/* ---------------- 震动 / 分享 / 生命周期 ---------------- */

	function haptic(kind) {
		if (IS_WX && wx.vibrateShort) {
			try { wx.vibrateShort({ type: kind === 'heavy' ? 'heavy' : 'light' }); } catch (e) { /* 忽略 */ }
			return;
		}
		if (g.navigator && typeof g.navigator.vibrate === 'function') {
			try { g.navigator.vibrate(kind === 'heavy' ? 28 : 12); } catch (e) { /* 忽略 */ }
		}
	}

	/**
	 * 复制到剪贴板（房间码用）。
	 *
	 * 浏览器的 navigator.clipboard **只在安全上下文里存在**：
	 *   https、localhost 可以；局域网 http://192.168.x.x 不行，
	 *   file:// 各浏览器不一（Quark / 部分安卓浏览器直接是 undefined）。
	 * 手机上用电脑托管（局域网 IP）或直接开本地文件时，正好都落在这个盲区，
	 * 于是「复制房间码」点了毫无反应。
	 *
	 * 所以主路径用 execCommand('copy')（http / file 下都可用，且能同步判定成败），
	 * 失败再退到 Clipboard API。小游戏走 wx.setClipboardData。
	 *
	 * 返回 true = 「已经发起复制」；cb(ok, how) 给出最终结果。
	 */
	function execCopy(text) {
		if (!g.document || !g.document.body || !g.document.createElement) return false;
		var ta = null;
		try {
			ta = g.document.createElement('textarea');
			ta.value = text;
			ta.setAttribute('readonly', 'readonly');
			ta.style.position = 'fixed';
			ta.style.top = '0';
			ta.style.left = '0';
			ta.style.width = '1px';
			ta.style.height = '1px';
			ta.style.padding = '0';
			ta.style.border = 'none';
			ta.style.outline = 'none';
			ta.style.background = 'transparent';
			ta.style.opacity = '0';
			ta.style.fontSize = '16px';       /* 防止 iOS 聚焦时页面缩放 */
			g.document.body.appendChild(ta);
			ta.focus();
			ta.select();
			if (ta.setSelectionRange) ta.setSelectionRange(0, text.length);
			return !!(g.document.execCommand && g.document.execCommand('copy'));
		} catch (e) {
			return false;
		} finally {
			if (ta && ta.parentNode) {
				try { ta.parentNode.removeChild(ta); } catch (e2) { /* 忽略 */ }
			}
		}
	}

	function setClipboard(text, cb) {
		var s = String(text === undefined || text === null ? '' : text);
		var done = function (ok, how) {
			if (cb) { try { cb(ok, how); } catch (e) { /* 忽略 */ } }
			return ok;
		};
		if (IS_WX && wx.setClipboardData) {
			try {
				wx.setClipboardData({
					data: s,
					success: function () { done(true, 'wx'); },
					fail: function () { done(false, 'wx'); },
				});
				return true;
			} catch (e) { /* 降级 */ }
		}
		if (execCopy(s)) { done(true, 'exec'); return true; }
		if (g.navigator && g.navigator.clipboard && g.navigator.clipboard.writeText) {
			try {
				g.navigator.clipboard.writeText(s).then(
					function () { done(true, 'api'); },
					function () { done(false, 'api'); }
				);
				return true;      /* 已发起 */
			} catch (e2) { /* 降级 */ }
		}
		done(false, 'none');
		return false;
	}

	/**
	 * 邀请好友：把房间码塞进分享卡片。
	 * 微信没有「加好友」接口，好友对战的标准做法就是分享卡片 ——

    }

    /* 4) 博弈：防御成功回血（每回合最多一次） */
    for (i = 0; i < n; i++) {
      if (blocked_any[i]) {
        _boyi_heal(s, i, _blocked_attack(i, acts), events);
      }
    }

    /* 5) 复活 */
    var rev_e = s.energy.slice();
    for (i = 0; i < n; i++) {
      if (I(s.hp[i]) === 0 && can_use(s, i, SK.Id.FUHUO)) {
        s.used[i][SK.Id.FUHUO] = true;
        s.hp[i] = Math.min(Q, I(s.max_hp[i]));
        s.energy[i] = Math.min(I(s.energy[i]), 1);
        events.push({ type: 'revive', target: i });
      }
    }
    if (!arrEq(s.energy, rev_e)) {
      events.push({
        type: 'energy', p1: s.energy[0],
        p2: n > 1 ? s.energy[1] : 0
      });
    }

    /* 6) 治愈 / 禁豆 / 金身 / 蓄势 / 连打 / 预测清理 */
    var loss = [];
    for (i = 0; i < n; i++) loss.push(dmg[i]);
    for (i = 0; i < n; i++) {
      if (I(dget(s.skills[i], SK.Id.ZHIYU, 0)) > 0) {
        if (I(loss[i]) > 0) {
          s.counters[i]['zhiyu'] = 0;
        } else {
          var zc = I(dget(s.counters[i], 'zhiyu', 0)) + 1;
          s.counters[i]['zhiyu'] = zc;
          if (zc >= 3 && can_use(s, i, SK.Id.ZHIYU)) {
            var zh = Math.min(2, I(s.max_hp[i]) - I(s.hp[i]));
            if (zh > 0) {
              s.hp[i] = I(s.hp[i]) + zh;
              events.push({ type: 'heal', target: i, amount: zh, src: 'zhiyu' });
            }
          }
        }
      }
      if (!!dget(s.counters[i], 'jin_fresh', false)) {
        s.counters[i]['jin_fresh'] = false;
      } else if (I(dget(s.counters[i], 'jin', 0)) > 0) {
        s.counters[i]['jin'] = I(s.counters[i]['jin']) - 1;
      }
      delete s.counters[i]['quanshen'];   /* Dictionary.erase("quanshen") */
      s.guess[i] = -1;
      _xushi_tick(s, i, acts[i], legals[i]);
      var st = s.def_streak[i];
      if (acts[i] === Action.FANG_TAO) {
        st = [st[0] + 1, 0];
      } else if (acts[i] === Action.FANG_GUIDAO) {
        st = [0, st[1] + 1];
      } else {
        st = [0, 0];
      }
      s.def_streak[i] = st;
    }

    /* 7) 淘汰与胜负（最后存活者胜；同回合归零比能量；30 回合比血量） */
    for (i = 0; i < n; i++) {
      if (I(s.hp[i]) <= 0) s.hp[i] = 0;
    }
    var alive = [];
    for (i = 0; i < n; i++) {
      if (I(s.hp[i]) > 0) alive.push(i);
    }
    var res = new TurnResult();
    _talents_restore(s, talents);
    res.state = s;
    res.events = events;
    if (alive.length <= 1) {
      if (alive.length === 1) {
        res.winner = alive[0];
      } else {
        /* 全部归零：比能量，最高者独赢，并列平局 */
        var best = -1;
        var best_e = -1;
        var tie = false;
        for (i = 0; i < n; i++) {
          if (I(s.energy[i]) > best_e) {
            best_e = I(s.energy[i]);
            best = i;
            tie = false;
          } else if (I(s.energy[i]) === best_e) {
            tie = true;
          }
        }
        res.winner = tie ? -2 : best;
      }
    } else {
      s.round += 1;
      if (s.round > MAX_ROUNDS) {
        var bh = -1;
        var bi = -1;
        var htie = false;
        for (i = 0; i < n; i++) {
          if (I(s.hp[i]) > bh) {
            bh = I(s.hp[i]);
            bi = i;
            htie = false;
          } else if (I(s.hp[i]) === bh) {
            htie = true;
          }
        }
        res.winner = htie ? -2 : bi;
      }
    }
    if (res.winner === 0) {
      res.outcome = Outcome.WIN_P1;
    } else if (res.winner === 1) {
      res.outcome = Outcome.WIN_P2;
    } else if (res.winner === -2) {
      res.outcome = Outcome.DRAW;
    } else {
      res.outcome = Outcome.ONGOING;
    }
    if (res.winner !== -1) {
      events.push({ type: 'outcome', winner: res.winner, result: res.outcome });
    }
    return res;
  }

  function _blocked_attack(defender, acts) {
    for (var j = 0; j < acts.length; j++) {
      var aj = acts[j];
      if (j === defender) continue;
      if ((acts[defender] === Action.FANG_TAO && aj === Action.TAO) ||
          (acts[defender] === Action.FANG_GUIDAO && aj === Action.GUIDAO)) {
        return aj;
      }
    }
    return Action.TAO;
  }

  /* ----------------------------------------
   * 可选集过滤器（玩家 UI 与 AI 共用，杜绝两端口径不一）
   * ---------------------------------------- */

  function legal_actions(state, player) {
    var out = [Action.PASS];                            /* R11 空过永远合法 */
    var e = I(state.energy[player]);
    var h = I(state.hp[player]);
    var cap = I(state.max_hp[player]);
    var streak = state.def_streak[player];
    if (e < MAX_ENERGY && !_hui_banned(state, player)) {
      out.push(Action.HUI);                             /* O3 满能禁选"回"；禁豆期间不可选 */
    }
    if (e >= I(ATTACK_COST[Action.TAO])) {
      out.push(Action.TAO);                             /* R10 能量不足不能打出 */
    }
    if (e >= I(ATTACK_COST[Action.GUIDAO])) {
      out.push(Action.GUIDAO);
    }
    if (h < cap && e >= 1) {
      out.push(Action.YAOPAO);                          /* O6 满血禁选；药包耗 1 豆 */
    }
    if (streak[0] < I(state.def_limit[player])) {
      out.push(Action.FANG_TAO);                        /* R9/O4 连打上限（三防 2 → 3） */
    }
    if (streak[1] < I(state.def_limit[player])) {
      out.push(Action.FANG_GUIDAO);
    }
    return out;
  }

  /* ----------------------------------------
   * 技能初始化：把两边的 loadout 灌进 MatchState
   * loadouts[i] = [技能 id, ...]（可重复，上限由 SK 截断）
   * ---------------------------------------- */

  function setup_skills(state, loadouts) {
    for (var i = 0; i < state.player_count(); i++) {
      var list = (i < loadouts.length) ? loadouts[i] : [];
      var lv = SK.levels_from_list(list);
      state.skills[i] = lv;
      state.used[i] = {};
      state.counters[i] = {
        jidou: 0, zhiyu: 0, neg: 0, xushi: {},
        hits: 0, jin: 0, gamble: -1
      };
      /* 强壮：血量上限 24Q + 5Q / 层；全能：每层上限 +1Q */
      var qz = I(dget(lv, SK.Id.QIANGZHUANG, 0));
      var qn = I(dget(lv, SK.Id.QUANNENG, 0));
      state.max_hp[i] = MAX_HP + I(SK.VALUES[SK.Id.QIANGZHUANG]) * qz +
        I(SK.VALUES[SK.Id.QUANNENG]) * qn;
      state.hp[i] = state.max_hp[i];
      /* 贪豆：开局 +1 豆（一次性） */
      state.energy[i] = hasOwn.call(lv, SK.Id.TANDOU) ? Math.min(1, MAX_ENERGY) : 0;
      /* 防御连打上限：基础 2，三防 +1，博弈 −1（最低 1） */
      var dl = DEFENSE_LIMIT + (hasOwn.call(lv, SK.Id.SANFANG) ? 1 : 0) -
        (hasOwn.call(lv, SK.Id.BOYI) ? 1 : 0);
      state.def_limit[i] = Math.max(dl, 1);
      state.def_streak[i] = [0, 0];
      state.shield[i] = 0;
      state.pure[i] = 0;
    }
    state.round = 1;
  }

  /* 一次性技能是否还能用（拥有 + 未使用 + 存活） */
  function can_use(state, player, id) {
    return I(dget(state.skills[player], id, 0)) > 0 &&
      !(!!dget(state.used[player], id, false)) &&
      I(state.hp[player]) > 0;
  }

  /* 调换：标记已用（UI 在结算前调用；换牌本身由 UI 决定新动作） */
  function mark_swap_used(state, player) {
    state.used[player][SK.Id.DIAOHUAN] = true;
  }

  /* ----------------------------------------
   * 天赋「临时失效」的存取
   *
   * 不屈（负血）/ 金身（主动）都会把 s.skills[i] 清空或只留一项，而 s 就是
   * 结算结束后返回的新状态。若不还原，一次金身 = 永久失去全部潜能，
   * 不屈负血回正后天赋也回不来 —— 这两者都是「本回合失效」，不是「永久删除」。
   * 因此在结算入口留档、出口还原；下一回合由 _deactivate_talents_if_negative
   * 按当时血量重新判定，语义不变。
   * ---------------------------------------- */

  function _talents_digest(state) {
    var out = { skills: [], def_limit: state.def_limit.slice() };
    for (var i = 0; i < state.player_count(); i++) out.skills.push(deepCopy(state.skills[i]));
    return out;
  }

  function _talents_restore(state, digest) {
    for (var i = 0; i < state.player_count(); i++) {
      state.skills[i] = digest.skills[i];
      state.def_limit[i] = digest.def_limit[i];
    }
  }

  /* 不屈：负血时其余天赋失效（保留不屈本身），连打上限回到基础值 */
  function _deactivate_talents_if_negative(state) {
    for (var i = 0; i < state.player_count(); i++) {
      var lv = state.skills[i];
      if (I(dget(lv, SK.Id.BUQU, 0)) > 0 && I(state.hp[i]) <= 0) {
        var only = {};
        only[SK.Id.BUQU] = I(lv[SK.Id.BUQU]);
        state.skills[i] = only;
        state.def_limit[i] = DEFENSE_LIMIT;
      }
    }
  }

  /* ----------------------------------------
   * 蓄势：闲置计数的累加规则
   *
   * 「闲置」= 有机会打出、但这回合没打。**打不出的牌不算闲置**。
   * 0 豆时掏/鬼刀/药包全部不可出，如果照旧累加，玩家会在攒豆期间
   * 白攒出「掏闲置 3」，一有豆就打出 4 点伤害 —— 数值凭空放大。
   * 因此累加前先看该牌在这回合是否合法可出。
   *
   * 另：**蓄势不作用于「回」**。蓄势的「数值 +n」指的是点数类数值
   * （掏/鬼刀伤害、药包治疗）；「回」的收益是豆，+n 豆等于白送 n 次攻击，
   * 量级完全失衡（实测 AI 一次「回」能拿 5 颗豆，是基础值的 5 倍）。
   * ---------------------------------------- */

  /* 蓄势：这张牌已闲置的回合数（上限 +3） */
  function _xushi_points(state, player, action) {
    if (I(dget(state.skills[player], SK.Id.XUSHI, 0)) <= 0) return 0;
    if (action === Action.HUI) return 0;   /* 「回」不吃蓄势 */
    var book = dget(state.counters[player], 'xushi', {});
    return Math.min(I(dget(book, action, 0)), 3);
  }

  /* 蓄势：回合末更新每张牌的闲置计数（打出的归零，其余 +1，封顶 3）
   * legal：该玩家这回合**起始**的合法动作集合；不在其中的牌不累加闲置。 */
  function _xushi_tick(state, player, played, legal) {
    if (I(dget(state.skills[player], SK.Id.XUSHI, 0)) <= 0) return;
    var book = dget(state.counters[player], 'xushi', {});
    var arr = [Action.HUI, Action.TAO, Action.GUIDAO, Action.YAOPAO,
      Action.FANG_TAO, Action.FANG_GUIDAO];
    for (var k = 0; k < arr.length; k++) {
      var act = arr[k];
      if (act === played) {
        book[act] = 0;
      } else if (legal && legal.indexOf(act) < 0) {
        /* 这回合根本打不出这张牌 → 不算闲置，计数保持原样 */
        continue;
      } else {
        book[act] = Math.min(I(dget(book, act, 0)) + 1, 3);
      }
    }
    state.counters[player]['xushi'] = book;
  }

  /* 禁豆：回被封锁（jin > 0 且不是刚发动的那一回合） */
  function _hui_banned(state, player) {
    return I(dget(state.counters[player], 'jin', 0)) > 0 &&
      !(!!dget(state.counters[player], 'jin_fresh', false));
  }

  /* 禁豆：发动（对手之后 2 回合不能用回） */
  function do_ban_bean(state, player) {
    state.used[player][SK.Id.JINDOU] = true;
    state.counters[1 - player]['jin'] = 2;
    state.counters[1 - player]['jin_fresh'] = true;
    return [{ type: 'ban', by: player }];
  }

  /* 献祭：付 1.0 血，从对手偷 1 豆（对手没豆 / 血量不足则不可用） */
  function can_sacrifice(state, player) {
    return can_use(state, player, SK.Id.XIANJI) &&
      I(state.hp[player]) > Q &&
      I(state.energy[1 - player]) >= 1;
  }

  function do_sacrifice(state, player) {
    var events = [];
    if (!can_sacrifice(state, player)) return events;
    state.used[player][SK.Id.XIANJI] = true;
    state.hp[player] = I(state.hp[player]) - Q;
    state.energy[1 - player] = I(state.energy[1 - player]) - 1;
    _gain_bean(state, player, 1, events);
    events.push({ type: 'sacrifice', by: player, hp: Q });
    return events;
  }

  /* 金身：本回合免疫一般伤害、且无法发动任何效果（一次性） */
  function do_focus(state, player) {
    state.used[player][SK.Id.QUANSHEN] = true;
    state.counters[player]['quanshen'] = 1;
    return [{ type: 'focus', by: player }];
  }

  /* 豪赌：血量 ≤1.0 时可发动（猜牌在 UI 里填 counters["gamble"]） */
  function can_gamble(state, player) {
    return can_use(state, player, SK.Id.HAODU) && I(state.hp[player]) <= Q;
  }

  /* 攻击牌的最终伤害（Q）：基础 + 暴击/鬼影 + 全能 + 逆战 + 均衡（斩杀在 resolve 里按目标血量判定） */
  function attack_damage(action, state, attacker) {
    var base = I(ATTACK_DAMAGE[action]);
    var lv = state.skills[attacker];
    if (action === Action.TAO) {
      base += I(SK.VALUES[SK.Id.BAOJI]) * I(dget(lv, SK.Id.BAOJI, 0));
    } else if (action === Action.GUIDAO) {
      base += I(SK.VALUES[SK.Id.GUIYING]) * I(dget(lv, SK.Id.GUIYING, 0));
    }
    /* 全能：掏/鬼刀 各 +1Q / 层 */
    base += I(SK.VALUES[SK.Id.QUANNENG]) * I(dget(lv, SK.Id.QUANNENG, 0));
    /* 逆战：以回合开始（伤害结算前）的血量判断 ≤ 2.0 */
    if (I(state.hp[attacker]) <= 8) {
      base += I(SK.VALUES[SK.Id.NIZHAN]) * I(dget(lv, SK.Id.NIZHAN, 0));
    }
    /* 均衡：敌方(血+豆) 比 我方(血+豆) 每高 1 点，+0.25，最多 +1.0 */
    base += _equilibrium_bonus(state, attacker);
    /* 蓄势：这张牌闲置 n 回合 → 伤害 +n 点（上限 +3） */
    base += _xushi_points(state, attacker, action) * Q;
    return base;
  }

  /* 均衡的伤害加成（Q）
   * 原式：floorf(op_total - my_total)，op_total = hp/Q + energy。
   * 血量恒为 Q 的整数倍，hp/Q 在二进制里精确，这里改成等价的整数 floor 除法。
   *
   * 1v1：对手就是对面那一位。
   * 3–4 人混战：原来的 `op = 1 - me` 会算出 -1 / 错座位，甚至 NaN
   *（座位 2 时 op = -1 → hp[-1] 是 undefined → 伤害算成 NaN）。
   * 这里改成「取所有对手里总资产最高的那一位」—— 均衡本来就是打最强对手的加成。 */
  function _equilibrium_bonus(state, me) {
    var lv = I(dget(state.skills[me], SK.Id.JUNHENG, 0));
    if (lv <= 0) return 0;
    var n = state.player_count();
    var my_q = I(state.hp[me]) + I(state.energy[me]) * Q;
    var best_q = -1;
    for (var i = 0; i < n; i++) {
      if (i === me) continue;
      var q = I(state.hp[i]) + I(state.energy[i]) * Q;
      if (q > best_q) best_q = q;
    }
    if (best_q < 0) return 0;                 /* 没有对手 */
    var diff = Math.floor((best_q - my_q) / Q);
    var stacks = Math.max(0, Math.min(I(diff), SK.JUNHENG_MAX_STACKS));
    return stacks * SK.JUNHENG_STEP * lv;
  }

  /* 斩杀：这一刀（含所有加成）能打死目标时，额外 +0.5（掏）/ +0.75（鬼刀） */
  function _zhanshou_bonus(action, dmg, target_hp, attacker, state) {
    if (I(dget(state.skills[attacker], SK.Id.ZHANSHOU, 0)) <= 0) return 0;
    var bonus = (action === Action.TAO) ? SK.ZHANSHOU_TAO : SK.ZHANSHOU_GUIDAO;
    if (dmg + bonus >= target_hp) return bonus;
    return 0;
  }

  /* 换防：错误防御的部分减伤（防掏挡鬼刀 −2Q/层；防鬼刀挡掏 −1Q/层） */
  function _huanfang_reduce(defense, attack, defender, state) {
    var lv = I(dget(state.skills[defender], SK.Id.HUANFANG, 0));
    if (lv <= 0) return 0;
    if (defense === Action.FANG_TAO && attack === Action.GUIDAO) {
      return I(SK.VALUES[SK.Id.HUANFANG]) * lv;
    }
    if (defense === Action.FANG_GUIDAO && attack === Action.TAO) {
      return 1 * lv;
    }
    return 0;
  }

  /* 伤害落地：先过[闪避]（每局一次，无视第一段伤害），再扣血。返回实际承受的伤害。 */
  function _apply_damage(state, target, amount, src, events) {
    if (amount <= 0) return 0;
    /* 金身：本回合免疫一般伤害（穿透无视） */
    if (I(dget(state.counters[target], 'quanshen', 0)) > 0 && src !== 'pierce') {
      events.push({ type: 'immune', target: target });
      return 0;
    }
    if (I(dget(state.skills[target], SK.Id.SHANBI, 0)) > 0 &&
        !(!!dget(state.used[target], SK.Id.SHANBI, false))) {
      state.used[target][SK.Id.SHANBI] = true;
      events.push({ type: 'dodge', target: target });
      return 0;
    }
    /* 护盾：先扣盾，再扣血（穿透在别处直接扣血，不走这里） */
    var absorbed = Math.min(amount, I(state.shield[target]));
    if (absorbed > 0) {
      state.shield[target] = I(state.shield[target]) - absorbed;
      events.push({ type: 'shield', target: target, amount: absorbed });
      amount -= absorbed;
      if (amount <= 0) return 0;
    }
    var has_buqu = I(dget(state.skills[target], SK.Id.BUQU, 0)) > 0;
    if (has_buqu) {
      state.hp[target] = I(state.hp[target]) - amount;   /* 不屈：允许负血 */
    } else {
      state.hp[target] = Math.max(I(state.hp[target]) - amount, 0);
    }
    events.push({ type: 'damage', target: target, amount: amount, src: src });
    return amount;
  }

  /* 药包回复量（Q）：基础 4Q + 医疗 3Q / 层 + 全能 1Q / 层 + 蓄势 n 点 */
  function heal_amount(state, player) {
    var lv = state.skills[player];
    return Q + I(SK.VALUES[SK.Id.YILIAO]) * I(dget(lv, SK.Id.YILIAO, 0)) +
      I(SK.VALUES[SK.Id.QUANNENG]) * I(dget(lv, SK.Id.QUANNENG, 0)) +
      _xushi_points(state, player, Action.YAOPAO) * Q;
  }

  /* ----------------------------------------
   * 回合结算（核心纯函数，顺序不可改动）
   * ---------------------------------------- */

  function resolve_turn(state, a, b, pierce_by, gamble_by) {
    if (pierce_by === undefined) pierce_by = -1;
    if (gamble_by === undefined) gamble_by = -1;
    var s = state.snapshot();
    var events = [];
    var i, j;
    var talents = _talents_digest(s);
    /* 不屈：负血期间其余天赋全部失效（连打上限也回到基础值） */
    _deactivate_talents_if_negative(s);
    /* 金身：本回合所有天赋失效（只有免伤在 _apply_damage 里处理） */
    for (i = 0; i < 2; i++) {
      if (I(dget(s.counters[i], 'quanshen', 0)) > 0) s.skills[i] = {};
    }

    /* 1. 合法性校验：非法动作一律按 PASS 处理（联机防作弊；O1 超时即 PASS）
     *    同时把本回合起始的合法动作集合留下来 —— 蓄势只对「打得出的牌」计闲置。 */
    var legal0 = legal_actions(s, 0);
    var legal1 = legal_actions(s, 1);
    if (legal0.indexOf(a) < 0) a = Action.PASS;
    if (legal1.indexOf(b) < 0) b = Action.PASS;
    events.push({ type: 'reveal', p1: a, p2: b });

    /* 2. 攻防相消标记（R4 同名克制生效 / R5 错误防御不拦截） */
    var a_blocked = (b === Action.FANG_TAO && a === Action.TAO) ||
      (b === Action.FANG_GUIDAO && a === Action.GUIDAO);
    var b_blocked = (a === Action.FANG_TAO && b === Action.TAO) ||
      (a === Action.FANG_GUIDAO && b === Action.GUIDAO);

    if (b_blocked) events.push({ type: 'block', attacker: 1 });

    var dmg = [0, 0];   /* dmg[i] = 玩家 i 受到的伤害（Q） */
    var mutual_cancel = _is_attack(a) && a === b;

      ((a === Action.TAO && b === Action.GUIDAO) || (a === Action.GUIDAO && b === Action.TAO));

      if (!(overpower && a === Action.TAO)) {

        d1 += _zhanshou_bonus(a, d1, I(s.hp[1]), 0, s);

        d0 += _zhanshou_bonus(b, d0, I(s.hp[0]), 1, s);
        dmg[0] = Math.max(d0 - _huanfang_reduce(a, b, 0, s), 0);

    }

    /* 3.5 打断判定（V1.2）：一方攻击、另一方 回/药包 → 回不回能、药包不回血；
     *     V1.3：被打断的药包同样不扣能量；攻击照常结算。 */
    var a_interrupted = _is_attack(b) && (a === Action.HUI || a === Action.YAOPAO);
    var b_interrupted = _is_attack(a) && (b === Action.HUI || b === Action.YAOPAO);
    if (a_interrupted) events.push({ type: 'interrupt', target: 0 });
    if (b_interrupted) events.push({ type: 'interrupt', target: 1 });

    /* 4. 能量结算：仍生效的攻击照常消耗（R2/R4，防御不返还）；
     *    V1.3「未生效就不付费」：被压制的掏、被打断的药包都不扣豆。 */
    var pre_energy = s.energy.slice();
    var a_pays = _is_attack(a) && !(overpower && a === Action.TAO);
    var b_pays = _is_attack(b) && !(overpower && b === Action.TAO);
    if (a_pays) s.energy[0] = Math.max(I(s.energy[0]) - I(ATTACK_COST[a]), 0);
    if (b_pays) s.energy[1] = Math.max(I(s.energy[1]) - I(ATTACK_COST[b]), 0);
    if (a === Action.YAOPAO && !a_interrupted) {
      s.energy[0] = Math.max(I(s.energy[0]) - 1, 0);
    }
    if (b === Action.YAOPAO && !b_interrupted) {
      s.energy[1] = Math.max(I(s.energy[1]) - 1, 0);
    }
    if (a === Action.HUI && !a_interrupted) {
      var ga = 1;
      if (I(dget(s.skills[0], SK.Id.CHUNDU, 0)) > 0 && I(s.pure[0]) >= SK.CHUNDU_ROUNDS) {
        ga = SK.CHUNDU_BEANS;
      }
      ga += _xushi_points(s, 0, Action.HUI);
      _gain_bean(s, 0, ga, events);
      _jidou_tick(s, 0, events);
      s.pure[0] = 0;
    } else if (a === Action.HUI) {
      /* 「回」被打断：牌确实出了，纯度计数同样清零
       * （与 resolve_round 口径一致，否则 1v1 与混战结算会分叉） */
      s.pure[0] = 0;
    } else if (I(dget(s.skills[0], SK.Id.CHUNDU, 0)) > 0) {
      s.pure[0] = I(s.pure[0]) + 1;
    }
    if (b === Action.HUI && !b_interrupted) {
      var gb = 1;
      if (I(dget(s.skills[1], SK.Id.CHUNDU, 0)) > 0 && I(s.pure[1]) >= SK.CHUNDU_ROUNDS) {
        gb = SK.CHUNDU_BEANS;
      }
      gb += _xushi_points(s, 1, Action.HUI);
      _gain_bean(s, 1, gb, events);
      _jidou_tick(s, 1, events);
      s.pure[1] = 0;
    } else if (b === Action.HUI) {
      s.pure[1] = 0;
    } else if (I(dget(s.skills[1], SK.Id.CHUNDU, 0)) > 0) {
      s.pure[1] = I(s.pure[1]) + 1;
    }
    /* 刀盾：使用鬼刀获得护盾（跨回合，上限 2.0） */
    if (a === Action.GUIDAO) _gain_shield(s, 0);
    if (b === Action.GUIDAO) _gain_shield(s, 1);

    /* 5. 治疗结算（药包 +4Q，clamp 上限；药包/药包各自生效 R8；V1.2 被打断则不回血） */
    if (a === Action.YAOPAO && !a_interrupted) {
      var ha = heal_amount(s, 0);
      s.hp[0] = Math.min(I(s.hp[0]) + ha, I(s.max_hp[0]));
      events.push({ type: 'heal', target: 0, amount: ha });
    }
    if (b === Action.YAOPAO && !b_interrupted) {
      var hb = heal_amount(s, 1);
      s.hp[1] = Math.min(I(s.hp[1]) + hb, I(s.max_hp[1]));
      events.push({ type: 'heal', target: 1, amount: hb });
    }

    /* 6. 伤害落地（含[闪避]）：返回实际承受的伤害 */
    var taken = [0, 0];
    taken[0] = _apply_damage(s, 0, dmg[0], 'attack', events);
    taken[1] = _apply_damage(s, 1, dmg[1], 'attack', events);

    /* 7. 反伤：按实际承受的攻击牌类型反弹（不吃防御/换防；可致死；反弹本身不再引发反伤） */
    if (taken[0] > 0 && _is_attack(b)) {
      var rf0 = I(dget(s.skills[0], SK.Id.FANSHANG, 0)) * (b === Action.TAO ? 1 : 2);
      if (rf0 > 0) {

      }
    }
    if (taken[1] > 0 && _is_attack(a)) {
      var rf1 = I(dget(s.skills[1], SK.Id.FANSHANG, 0)) * (a === Action.TAO ? 1 : 2);
      if (rf1 > 0) {
        events.push({ type: 'reflect', target: 0, amount: rf1 });
        _apply_damage(s, 0, rf1, 'reflect', events);
      }
    }

    /* 8. 吸血：按实际造成的伤害回复（每次出牌最多一次；已死则不再回复） */
    if (taken[1] > 0 && _is_attack(a) && I(s.hp[0]) > 0) {
      var xs0 = I(dget(s.skills[0], SK.Id.XIXUE, 0)) * (a === Action.TAO ? 1 : 2);
      if (xs0 > 0) {
        var h0 = Math.min(xs0, I(s.max_hp[0]) - I(s.hp[0]));
        if (h0 > 0) {

          events.push({ type: 'heal', target: 0, amount: h0, src: 'xixue' });
        }
      }
    }
    if (taken[0] > 0 && _is_attack(b) && I(s.hp[1]) > 0) {
      var xs1 = I(dget(s.skills[1], SK.Id.XIXUE, 0)) * (b === Action.TAO ? 1 : 2);
      if (xs1 > 0) {
        var h1 = Math.min(xs1, I(s.max_hp[1]) - I(s.hp[1]));
        if (h1 > 0) {
          s.hp[1] = I(s.hp[1]) + h1;
          events.push({ type: 'heal', target: 1, amount: h1, src: 'xixue' });
        }
      }
    }

    /* 7. 能量事件（供演出层播放数字变化） */
    if (!arrEq(s.energy, pre_energy)) {
      events.push({ type: 'energy', p1: s.energy[0], p2: s.energy[1] });
    }

    /* 8.5 博弈：防御成功时回血 */
    if (a_blocked) _boyi_heal(s, 1, a, events);
    if (b_blocked) _boyi_heal(s, 0, b, events);

    /* 9. 复活（一次性）：致命伤后以 1.0 血重新加入，豆至多保留 1 */
    var rev_energy = s.energy.slice();
    for (i = 0; i < 2; i++) {
      if (I(s.hp[i]) === 0 && I(dget(s.skills[i], SK.Id.FUHUO, 0)) > 0 &&
          !(!!dget(s.used[i], SK.Id.FUHUO, false))) {
        s.used[i][SK.Id.FUHUO] = true;
        s.hp[i] = Math.min(Q, I(s.max_hp[i]));
        s.energy[i] = Math.min(I(s.energy[i]), 1);

      }
    }
    if (!arrEq(s.energy, rev_energy)) {
      events.push({ type: 'energy', p1: s.energy[0], p2: s.energy[1] });

    /* 10. 治愈（持续被动）：连续 3 回合未受伤，第 3 回合当回合起每回合 +2Q；受伤清零 */

    for (i = 0; i < 2; i++) {
      if (I(dget(s.skills[i], SK.Id.ZHIYU, 0)) <= 0) continue;
      if (loss[i] > 0) {
        s.counters[i]['zhiyu'] = 0;
      } else {
        var zc = I(dget(s.counters[i], 'zhiyu', 0)) + 1;
        s.counters[i]['zhiyu'] = zc;
        if (zc >= 3 && I(s.hp[i]) > 0) {
          var zh = Math.min(2, I(s.max_hp[i]) - I(s.hp[i]));
          if (zh > 0) {
            s.hp[i] = I(s.hp[i]) + zh;
            events.push({ type: 'heal', target: i, amount: zh, src: 'zhiyu' });

    }

    /* 10.5 穿透（主动一次性）：出牌者本回合按空过处理，另外直接造成 4Q 真伤；

    if (pierce_by >= 0 && pierce_by < 2) {

        var pdmg = Math.min(4, Math.max(I(s.hp[ptgt]) - 1, 0));
        if (pdmg > 0) {
          s.hp[ptgt] = I(s.hp[ptgt]) - pdmg;

    _xushi_tick(s, 1, b, legal1);

    if (gamble_by >= 0 && gamble_by < 2) {

        s.energy[gamble_by] = 0;

        if (guessed >= 0 && guessed === opp_act) {
          _apply_damage(s, gt, bet * Q, 'gamble', events);
          events.push({ type: 'gamble', by: gamble_by, hit: true, amount: bet * Q });
        } else {
          s.hp[gamble_by] = 0;
          events.push({ type: 'gamble', by: gamble_by, hit: false, amount: 0 });
        }
      }
    }

    /* 10.7 猜点：每回合预测对手出牌，连中 3 次得 1 豆（满豆则回 1.0 血） */
    for (i = 0; i < 2; i++) {
      if (I(dget(s.skills[i], SK.Id.CAIDIAN, 0)) <= 0 || I(s.round) < 2) continue;
      var gv = I(s.guess[i]);
      if (gv < 0) continue;
      var opp_a = (i === 0) ? b : a;
      if (gv === opp_a) {
        var hits = I(dget(s.counters[i], 'hits', 0)) + 1;
        s.counters[i]['hits'] = hits;
        events.push({ type: 'guess', target: i, hit: true, hits: hits });
        if (hits >= 3) {
          s.counters[i]['hits'] = 0;
          if (I(s.energy[i]) < MAX_ENERGY) {
            _gain_bean(s, i, 1, events);
          } else {
            var gh = Math.min(Q, I(s.max_hp[i]) - I(s.hp[i]));
            if (gh > 0) {
              s.hp[i] = I(s.hp[i]) + gh;
              events.push({ type: 'heal', target: i, amount: gh, src: 'caidian' });
            }

        events.push({ type: 'guess', target: i, hit: false, hits: 0 });

    }

    for (i = 0; i < 2; i++) {
      var act = (i === 0) ? a : b;
      var st = s.def_streak[i];
      if (act === Action.FANG_TAO) {

      } else if (act === Action.FANG_GUIDAO) {

      delete s.counters[i]['quanshen'];
      s.guess[i] = -1;

    for (i = 0; i < 2; i++) {
      if (I(dget(s.skills[i], SK.Id.BUQU, 0)) > 0) {
        if (I(s.hp[i]) <= 0) {
          s.counters[i]['neg'] = I(dget(s.counters[i], 'neg', 0)) + 1;
        } else {
          s.counters[i]['neg'] = 0;
        }
      }
    }
    var dead = [false, false];
    for (i = 0; i < 2; i++) {
      if (I(s.hp[i]) <= 0) {
        dead[i] = true;
        if (I(dget(s.skills[i], SK.Id.BUQU, 0)) > 0 &&
            I(dget(s.counters[i], 'neg', 0)) < 2) {
          dead[i] = false;
        } else {
          s.hp[i] = 0;
        }
      }
    }
    var outcome = Outcome.ONGOING;
    if (dead[0] && dead[1]) {
      if (s.energy[0] > s.energy[1]) {
        outcome = Outcome.WIN_P1;
      } else if (s.energy[1] > s.energy[0]) {
        outcome = Outcome.WIN_P2;
      } else {
        outcome = Outcome.DRAW;
      }
    } else if (dead[0]) {
      outcome = Outcome.WIN_P2;
    } else if (dead[1]) {
      outcome = Outcome.WIN_P1;
    } else {
      s.round += 1;
      if (s.round > MAX_ROUNDS) {
        if (s.hp[0] > s.hp[1]) {
          outcome = Outcome.WIN_P1;
        } else if (s.hp[1] > s.hp[0]) {
          outcome = Outcome.WIN_P2;
        } else {
          outcome = Outcome.DRAW;
        }
      }
    }

    if (outcome !== Outcome.ONGOING) {
      events.push({ type: 'outcome', result: outcome });
    }

    var res = new TurnResult();
    _talents_restore(s, talents);
    res.state = s;
    res.events = events;
    res.outcome = outcome;
    return res;
  }

  function _jidou_tick(state, player, events) {

    var c = I(dget(state.counters[player], 'jidou', 0)) + 1;

      state.hp[defender] = I(state.hp[defender]) + h;
      events.push({ type: 'heal', target: defender, amount: h, src: 'boyi' });

  }

  var RC = {
    Action: Action,

    resolve_turn: resolve_turn,

/* ai_brain.js —— 能量豆对战 · AI 决策（ai_brain.gd 的逐行 JS 移植）

 *
 * 强度分层（1–6 档，档间必须单调）：

 *   2 学徒：会算期望，但对手模型是均匀随机，且经常点错
 *   3 老练：对手模型改用先验（会防御、会攒豆、会补刀），偶尔点错
 *   4 精锐：对手模型叠加「你的出牌频率」读牌，几乎不点错
 *   5 宗师：在 4 档基础上再往前看一手（我出 → 对方应 → 我再出）

/**
 * net/link_memory.js —— 内存回环链路（测试 / 同机双端调试用）
 *
 * 会话层只认 link 的三个回调，所以「两端在同一个进程里」和「两端隔着公网」
 * 对上层是同一件事。测试用它可以在毫秒内跑完几十回合，还能注入丢包和延迟。
 *

 *   var pair = WxNetLinkMem.pair({ dropRate: 0.2, seed: 7 });

/**
 * net/link_cloud.js —— 把小游戏接到微信云开发上的 link 实现

 */

<script>
/**
 * net/replay.js —— 观战 / 回放：把消息日志重放成完整对局
 *
 * 云端房间就是一份只追加的日志，所以「观战」和「回放」是同一件事：
 * 拿日志 + 初始潜能把每一回合重新算一遍。规则层是纯函数，重放结果与实时必然一致。
 *
 * 顺带做一件事：**校验指纹**。日志里双方都发过每回合的局面指纹，重放时逐回合比对，
 * 能证明这份回放没有被篡改过（比如有人偷偷改了自己血量再上传）。
 */
(function (g) {
	'use strict';

	var H = g.WxNetHash;
	var P = g.WxNetProto;

	// 规则层用的时候再取：模块加载顺序不该成为隐性依赖
	function rc() { return g.RC; }

	function Replay(cfg) {
		cfg = cfg || {};
		this.n = Math.trunc(cfg.n || 2);
		this.loadout = cfg.loadout || { host: [], guest: [] };
		this.msgs = cfg.msgs || [];

		this.turns = [];        // [{round, host, guest, outcome, states:[h,c]}]
		this.badHash = [];      // 指纹不符的回合号
		this.badDetail = [];    // 具体哪个座位、期望与实际
		this.finished = false;
		this.winner = -1;
		this.error = '';
	}

	/**
	 * 解析日志。只认 reveal（出牌）和 hash（指纹），其余消息（hello/commit）跳过。
	 * 回放不需要 commit-reveal 的过程，只要最终的牌 —— 但保留 hash 用于校验。
	 */
	Replay.prototype.parse = function () {
		var self = this;
		var plays = {};          // round → { host: act, guest: act }
		var hashes = {};         // round → { host: h, guest: h }

		for (var i = 0; i < this.msgs.length; i++) {
			var raw = this.msgs[i];
			var text = (typeof raw === 'string') ? raw : (raw && raw.d);
			var from = (raw && raw.f) || '';
			if (!text) continue;
			var m = P.decode(text);
			if (!m) continue;

			var r = Math.trunc(m.r);
			if (!(r > 0)) continue;

			if (m.t === P.T.REVEAL) {
				if (!plays[r]) plays[r] = {};
				plays[r][from] = P.validAction(m.a);
			} else if (m.t === P.T.HASH) {
				if (!hashes[r]) hashes[r] = {};
				hashes[r][from] = String(m.h);
			}

		var state = new (rc().MatchState)(this.n);
		var loads = [];
		for (var k = 0; k < this.n; k++) {
			loads.push(k === 0 ? (this.loadout.host || []) : (this.loadout.guest || []));
		}
		rc().setup_skills(state, loads);

		var rounds = Object.keys(plays).map(Number).sort(function (a, b) { return a - b; });

		for (var q = 0; q < rounds.length; q++) {
			var rd = rounds[q];
			var pl = plays[rd];
			if (pl.host === undefined || pl.guest === undefined) {
				this.error = '第 ' + rd + ' 回合缺一方的摊牌';
				break;
			}

			var res = rc().resolve_turn(state, pl.host, pl.guest);
			state = res.state;

			var turn = {
				round: rd,
				host: pl.host,
				guest: pl.guest,
				outcome: res.outcome,
				events: res.events,
				state: state,
			};
			this.turns.push(turn);

			/*
			 * 指纹校验：两端上报的**是同一个值**。
			 * 房主不翻转、客户端把自己的座位翻转后再算，结果都等于「房主视角」的指纹。
			 * 回放器的 state 本来就是房主视角，所以两边都拿 stateHash(state, false) 比。
			 * （早期版本对 guest 又翻转了一次，等于翻了两遍，必然不符。）
			 */
			var hh = hashes[rd] || {};
			var hHost = H.stateHash(state, false);
			if (hh.host && hHost !== hh.host) {
				this.badHash.push(rd);
				this.badDetail.push({ r: rd, seat: 'host', want: hHost.slice(0, 12), got: String(hh.host).slice(0, 12) });
			}
			if (hh.guest && hHost !== hh.guest) {
				this.badHash.push(rd);
				this.badDetail.push({ r: rd, seat: 'guest', want: hHost.slice(0, 12), got: String(hh.guest).slice(0, 12) });
			}

			if (res.outcome !== rc().Outcome.ONGOING) {
				this.finished = true;
				this.winner = outcomeToWinner(res.outcome);
				break;
			}
		}

		if (!this.finished && rounds.length && this.turns.length === rounds.length) {
			// 日志到这儿就没了（对局被打断），不算异常
		}
		return this;
	};

	function outcomeToWinner(o) {
		var O = rc().Outcome;
		if (o === O.WIN_P1) return 0;
		if (o === O.WIN_P2) return 1;
		if (o === O.DRAW) return -2;
		return -1;
	}

	/** 第 i 回合结束后的局面（i=0 是开局前），给进度条拖动用 */
	Replay.prototype.stateAt = function (i) {
		if (i <= 0) {
			var s = new (rc().MatchState)(this.n);
			var loads = [];
			for (var k = 0; k < this.n; k++) loads.push(k === 0 ? (this.loadout.host || []) : (this.loadout.guest || []));
			rc().setup_skills(s, loads);
			return s;
		}
		var t = this.turns[Math.min(i, this.turns.length) - 1];
		return t ? t.state : null;
	};

	Replay.prototype.rounds = function () { return this.turns.length; };

	Replay.prototype.summary = function () {
		return {
			rounds: this.turns.length,
			finished: this.finished,
			winner: this.winner,
			badHash: this.badHash.slice(),
			error: this.error,
			trusted: this.badHash.length === 0 && !this.error,
		};
	};

	/** 一句话战报，回放列表里直接显示 */
	Replay.prototype.headline = function () {
		if (this.error) return this.error;
		if (!this.turns.length) return '还没有可回放的内容';
		if (this.badHash.length) return '指纹不符（第 ' + this.badHash.join('、') + ' 回合），这份记录不可信';
		if (this.finished) {
			return this.winner === -2 ? '平局（' + this.turns.length + ' 回合）'
				: (this.winner === 0 ? '房主胜' : '加入方胜') + '（' + this.turns.length + ' 回合）';
		}
		return '进行到第 ' + this.turns.length + ' 回合';
	};

	g.WxNetReplay = { Replay: Replay };
})(typeof globalThis !== 'undefined' ? globalThis : this);
