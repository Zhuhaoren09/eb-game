		var aiObs = {};
		var aiRng = AIB.DEFAULT_RNG;

		/* ---------------- 联机模式 ----------------
		 * net = null 时是单机（对手 = AI）；
		 * net 非空时对手是真人，本地不再跑 AI，而是等对面把动作送过来。
		 *
		 * 座位约定（关键）：**本地玩家永远是座位 0**。
		 * 联机同步层的 stateHash(flip) 就是按这个约定设计的 ——
		 * guest 端上报指纹时翻转座位，两端才能对上。
		 * 所以联机时本地依然把自己当 0 号，对手当 1 号，
		 * 牌桌逻辑（血量/豆数/手牌/事件演出）完全不用改。
		 */
		var net = null;              /* { session, onEvent } */
		var netPending = false;      /* 本地已交牌，等对手 */
		var netPeerAct = -1;         /* 对手这一回合的动作 */
		var netPeerIntent = null;    /* 对手的主动技能意图 */
		var netStatus = '';          /* 联机状态文案（显示在提示行） */
		var netReady = false;        /* 握手完成 */
		var netMyIntent = null;      /* 本回合我要带上的主动技能意图 */
		var netBroken = false;       /* 断线（判负用） */
		var netWait = 0;            /* 等待对手已提交的秒数 */
		var netGambleGuess = -1;    /* 联机：本回合我押注的牌（-1 = 不押） */
		var netMySeat = 0;          /* 联机：我在房间里的绝对座位（0 = 房主） */

		var busy = false;
		var over = false;
		var countdown = ROUND_SECONDS;
		var roundNo = 1;
		var timeStr = '30';
		var timeDanger = false;

		var actions = [
			RC.Action.HUI, RC.Action.TAO, RC.Action.GUIDAO,
			RC.Action.YAOPAO, RC.Action.FANG_TAO, RC.Action.FANG_GUIDAO,
		];

		var hand = [];
		var seats = [];
		var ghosts = true;
		var hint = '选择一张牌';
		var logs = [];

		/* ---------------- 实时数值层 ----------------
		 * 之前血量 / 豆数是直接读结算后的 state，一旦结算就整块跳变，
		 * 和「−1」浮字对不上 —— 看起来像数值没同步。
		 * 现在拆成三层：
		 *   vt   目标值（逻辑真值，由结算事件逐步写入）
		 *   view 显示值（每帧向 vt 缓动，绘制用这个）
		 *   steps 事件时间轴（与浮字同一条节拍，按 seq*0.07 依次触发）
		 * 于是「先浮字冒出来 → 数字跟着掉下去」，视觉上就是实时的。
		 */
		var vt = { hp: [], energy: [], shield: [] };
		var view = { hp: [], energy: [], shield: [] };
		var steps = [];
		var tNow = 0;
		var fx = F.create();
		var shake = 0;
		var deadShown = [];

		function sched(delay, fn) {
			steps.push({ at: tNow + delay, fn: fn });
		}

		function syncView() {
			for (var i = 0; i < n; i++) {
				vt.hp[i] = Math.trunc(state.hp[i]);
				vt.energy[i] = Math.trunc(state.energy[i]);
				vt.shield[i] = Math.trunc(state.shield[i]);
				view.hp[i] = vt.hp[i];
				view.energy[i] = vt.energy[i];
				view.shield[i] = vt.shield[i];
			}
		}

		var playerSlot = null;
		var fly = null;
		var floats = [];
		var anims = [];
		var co = null;
		var actsCache = [];
		var overlay = { on: false, title: '', sub: '' };

		var lastCfg = { n: 2, levels: [3], loadoutP: [], loadoutA: [] };

		/* 主动技能运行时 */
		var pierceArmed = false;
		var swapArmed = false;
		var guessSel = -1;
		var picker = { on: false, mode: 'guess', sel: -1 };
		var swapGate = null;
		var swapLeft = 0;
		var menuArmed = 0;
		var stats = { dmg: 0, taken: 0, heal: 0, rounds: 0 };

		/* 布局 */
		var lay = {};

		/* ---------------- 布局推导 ---------------- */

		function layoutPass() {
			var o = {};
			var extra = clamp((BOT - TOP) - DEF_H, 0, 700);   // 比 1334 多出来的高度

			o.headerY = TOP + 10;
			o.ruleY = o.headerY + 34;

			// 桌面自上而下：立方体 → 名字/豆 → 对手牌 → 自己牌 → 状态 → 提示 → 战报
			// 间隙只是基准值，多出来的高度按权重摊进 g3 / g6（桌面与信息区），最后再整体居中。
			var g1 = 56 + extra * 0.04;    // 分隔线 → 立方体
			var g2 = 18 + extra * 0.01;    // 立方体 → 名字
			var g3 = 64 + extra * 0.10;    // 名字/豆 → 对手牌
			var g4 = 26 + extra * 0.10 + (n >= 3 ? 22 : 0);    // 对手牌 → 自己牌
			var g5 = 20 + extra * 0.04;    // 自己牌 → 状态
			var g6 = 74 + extra * 0.20;    // 状态 → 提示
			var g7 = 26 + extra * 0.04;    // 提示 → 战报

			o.rad = (n === 2 ? 54 : (n === 3 ? 46 : 38)) * (1 + extra / 6000);
			o.cubeCy = o.ruleY + g1 + o.rad * 1.39;
			o.infoY = o.cubeCy + o.rad * 1.39 + g2;
			o.foeCardY = o.infoY + g3;
			o.slotTop = o.foeCardY + CH * FOE_SCALE + g4;
			o.slotCy = o.slotTop + CH * 0.5;
			o.statusTop = o.slotTop + CH + g5;
			o.statusH = 92;
			o.hintY = o.statusTop + o.statusH + 18;
			o.logY = o.hintY + 20 + g7;

			// 底部锚定：手牌 → 按钮 → 技能条
			o.handY = BOT - 22 - 46 - 14 - CH;
			o.footY = o.handY + CH + 14;
			o.skillBarY = o.handY - 14 - 46;
			o.chipH = 46;

			// 战报行数按剩余高度取，整块在「分隔线 → 技能条」之间居中
			var room = o.skillBarY - 24 - o.logY;
			o.logLines = clamp(Math.floor(room / 18), 3, 6);
			o.logH = o.logLines * 18;

			var blockTop = o.cubeCy - o.rad * 1.39;
			var blockH = (o.logY + o.logH) - blockTop;
			var availTop = o.ruleY + 6;
			var availBottom = o.skillBarY - 24;
			var free = (availBottom - availTop) - blockH;
			if (free > 0) {
				var d = free * 0.5;
				o.cubeCy += d;
				o.infoY += d;
				o.foeCardY += d;
				o.slotTop += d;
				o.slotCy += d;
				o.statusTop += d;
				o.hintY += d;
				o.logY += d;
			}
			return o;
		}

		function recalc() {
			BOT = H - (t.safeBottom || 0);
			TOP = t.safeTop || 0;
			lay = layoutPass();
		}

		/* ---------------- 工具 ---------------- */

		function fmt(q) {
			var pts = q / RC.Q;
			if (Math.abs(pts - Math.round(pts)) < 0.001) return String(Math.round(pts));
			return pts.toFixed(2);
		}

		function levelName(i) {
			if (i - 1 < aiLevels.length) {
				var v = AIB.LEVEL_NAMES[Math.trunc(aiLevels[i - 1])];
				return (v === undefined || v === null) ? '?' : String(v);
			}
			return '?';
		}

		function who(i) {
			if (i === 0) return '你';
			return net ? '对手' : ('AI ' + i);
		}

		/** 座位上的名字：单机是「AI 1 · 精锐」，联机就是「对手」 */
		function seatName(i, alive) {
			var base = net ? '对手' : ('AI ' + i + ' · ' + levelName(i));
			return base + (alive ? '' : ' · 阵亡');
		}

		function logLine(text) {
			logs.push(text);
			while (logs.length > 40) logs.shift();
		}

		function logMaxLines() {
			return lay.logLines || 4;
		}

		function addFloat(pos, text, col, seq) {
			if (floats.length > 24) floats.shift();
			floats.push({
				x: pos[0], y: pos[1], text: String(text), col: col,
				t: -(seq || 0) * 0.07, dy: 0, a: 0, size: 24,
			});
		}

		function posOf(i) {
			if (i <= 0) return [W * 0.5, lay.slotCy];
			var s = seats[i - 1];
			return s ? [s.cx, s.cy] : [W * 0.5, 200];
		}

		/** 结算层整体的顶端：按块高在可视区里居中 */
		function overlayTop() {
			return TOP + Math.max(40, ((BOT - TOP) - 308) * 0.5);
		}

		function haptic(kind) {
			if (g.WxPlatform && g.WxPlatform.haptic) g.WxPlatform.haptic(kind);
		}

		function hasSkill(seat, id) {
			return Math.trunc(((state.skills[seat] || {})[id]) || 0) > 0;
		}

		/* ---------------- 座位 ---------------- */

		function buildSeats() {
			var cubes;
			if (n === 2) cubes = [[W * 0.5, 0]];
			else if (n === 3) cubes = [[200.0, 0], [W - 200.0, 0]];
			else cubes = [[140.0, 0], [W * 0.5, 0], [W - 140.0, 0]];

			seats = [];
			for (var i = 1; i < n; i++) {
				var c = cubes[i - 1];
				var cy = lay.cubeCy;
				var rad = lay.rad;
				seats.push({
					i: i,
					cx: c[0],
					cy: cy,
					rad: rad,
					infoY: cy + rad * 1.39 + 14,
					color: S.CUBE[(i - 1) % S.CUBE.length],
					spin: i * 0.6,
					alive: true,
					name: seatName(i, true),
					barW: 96.0,
					card: null,
				});
			}
		}

		/* ---------------- 局 / 回合 ---------------- */

		function clearCards() {
			playerSlot = null;
			for (var i = 0; i < seats.length; i++) seats[i].card = null;
		}

		function refreshAll() {
			for (var i = 1; i < n; i++) {
				var s = seats[i - 1];
				if (!s) continue;
				var chp = Math.trunc(vt.hp[i]);
				var ccap = Math.max(Math.trunc(state.max_hp[i]), 1);
				s.barW = 96.0 * clamp(chp / ccap, 0.0, 1.0);
				s.name = seatName(i, chp > 0);
				s.alive = chp > 0;
			}
			refreshHand();
		}

		function refreshHand() {
			var legal = RC.legal_actions(state, 0);
			for (var i = 0; i < hand.length; i++) {
				hand[i].dim = legal.indexOf(Math.trunc(actions[i])) < 0;
				hand[i].alpha = 1;
			}
		}

		function beginRound() {
			if (over || state === null) return;
			busy = false;
			pierceArmed = false;
			swapArmed = false;
			countdown = ROUND_SECONDS;
			roundNo = Math.trunc(state.round);
			timeStr = String(Math.trunc(Math.ceil(countdown)));
			timeDanger = false;
			ghosts = (playerSlot === null);
			refreshAll();
			hint = '选择一张牌';
			stats.rounds = roundNo;
		}

		function startMatch(c) {
			c = c || {};
			n = Math.trunc(c.n === undefined ? 2 : c.n);
			n = Math.max(2, Math.min(4, n));
			aiLevels = (c.levels || [3]).slice();
			playerSkills = (c.loadoutP || []).slice();
			aiSkills = (c.loadoutA || []).slice();
			lastCfg = {
				n: n, levels: aiLevels.slice(),
				loadoutP: playerSkills.slice(), loadoutA: aiSkills.slice(),
			};

			state = new RC.MatchState(n);
			var loads = [playerSkills];
			for (var i = 1; i < n; i++) loads.push(aiSkills);
			RC.setup_skills(state, loads);

			aiObs = {};
			over = false;
			busy = false;
			roundNo = 1;
			overlay = { on: false, title: '', sub: '' };
			co = null;
			anims = [];
			floats = [];
			fly = null;
			logs = [];
			actsCache = [];
			pierceArmed = false;
			swapArmed = false;
			guessSel = -1;
			picker = { on: false, mode: 'guess', sel: -1 };
			swapGate = null;
			swapLeft = 0;
			menuArmed = 0;
			stats = { dmg: 0, taken: 0, heal: 0, rounds: 0 };
			steps = [];
			tNow = 0;
			shake = 0;
			deadShown = [];
			fx.clear();

			clearCards();
			recalc();
			buildSeats();

			hand = [];
			for (var k = 0; k < actions.length; k++) {
				hand.push({ act: Math.trunc(actions[k]), dim: false, alpha: 1 });
			}

			syncView();

			hint = '选择一张牌';
			beginRound();
		}

		/* ---------------- AI ---------------- */

		function aiPick(player, playerAct) {
			var level = 3;
			var li = player - 1;
			if (li >= 0 && li < aiLevels.length) level = clamp(Math.trunc(aiLevels[li]), 1, 6);
			var known = {};
			if (player >= 1 && playerAct >= 0 && AIB.wants_peek(level, aiRng)) {
				known[0] = Math.trunc(playerAct);
			}
			return AIB.pick(state, player, level, aiObs, aiRng, known);
		}

		/* ---------------- 出牌 ---------------- */

		/**
		 * 组装本回合要带上的主动技能意图。
		 * 联机时这些意图必须跟着牌一起承诺、一起摊牌，
		 * 否则两端跑出的局面不同 → 指纹不一致 → 被判不同步。
		 *
		 * 猜点与豪赌的**押注值**也要一起带（it.guess / it.gambleGuess）：
		 * 押注值决定结算时对方猜中没，漏了它两端结果必然不同。
		 */
		function buildIntent(act) {
			var it = {
				guess: -1,
				gambleGuess: -1,
				/* 穿透：必须点「穿透」确认过，而且这一手按空过算 ——
				 * 顺手点了穿透却出别的牌，就当作没发动（与单机一致）。 */
				pierce: pierceArmed && Math.trunc(act) === RC.Action.PASS,
				gamble: false,
				sacrifice: false,
				focus: false,
				ban: false,
				swap: false,
			};
			if (hasSkill(0, SK.Id.CAIDIAN) && guessSel >= 0) it.guess = guessSel;
			/* 豪赌：押注的是「对手会出哪张牌」。
			 * 联机时这个值既进承诺哈希（防事后改押），也明文随摊牌发给对手
			 * （对手要拿它判「猜中没」）。 */
			if (hasSkill(0, SK.Id.HAODU) && netGambleGuess >= 0) {
				it.gamble = true;
				it.gambleGuess = netGambleGuess;
			}
			return it;
		}

		function submit(act0, pierceBy, gambleBy) {
			if (busy || over || state === null || picker.on) return false;
			if (net && !netReady) { hint = '对手还没接入…'; return false; }
			if (pierceBy === undefined) pierceBy = -1;
			if (gambleBy === undefined) gambleBy = -1;

			busy = true;
			countdown = ROUND_SECONDS;
			hint = '出牌';

			var legal = RC.legal_actions(state, 0);
			var mine = Math.trunc(act0);
			if (legal.indexOf(mine) < 0) mine = RC.Action.PASS;

			/* ---- 联机：交给同步层，等对手 ---- */
			if (net) {
				/* 意图必须在 pierceArmed 被清掉**之前**采集，
				 * 否则「穿透」这一回合永远发不出去。 */
				var it = buildIntent(mine);
				netMyIntent = it;
				netPending = true;
				netPeerAct = -1;
				netPeerIntent = null;
				netWait = 0;
				pierceArmed = false;
				netGambleGuess = -1;
				hint = '等待对手出牌…';
				net.session.submitLocal(roundNo, mine, it);
				if (net.session.link && net.session.link.setBusy) net.session.link.setBusy(true);
				return true;
			}

			pierceArmed = false;
			netGambleGuess = -1;

			var acts = [mine];
			for (var i = 1; i < n; i++) {
				if (Math.trunc(state.hp[i]) <= 0) acts.push(RC.Action.PASS);
				else acts.push(aiPick(i, mine));
			}
			for (var k = 0; k < n; k++) {
				AIB.note(aiObs, k, Math.trunc(acts[k]), Math.trunc(state.energy[k]));
			}

			// 猜点：把预测写进状态，结算时从快照里读
			state.guess[0] = (hasSkill(0, SK.Id.CAIDIAN) && guessSel >= 0) ? guessSel : -1;

			co = new Runner(playAndResolve(acts, { pierceBy: pierceBy, gambleBy: gambleBy }));
			return true;
		}

		/* ---------------- 联机：收到对手动作后结算 ---------------- */

		/**
		 * 同步层收到双方动作后回调。
		 * @param round 回合号
		 * @param myAct 我的动作
		 * @param peerAct 对手的动作
		 * @param intents { myIntent, peerIntent }
		 */
		function netOnRound(round, myAct, peerAct, intents) {
			if (over || state === null) return;
			var r = Math.trunc(round);
			if (r !== roundNo) {
				/* 回合号对不上（重连后补帧）：忽略，等当前回合结束 */
				return;
			}
			netPending = false;
			netPeerAct = Math.trunc(peerAct);
			netPeerIntent = (intents && intents.peerIntent) ? intents.peerIntent : null;
			if (net.session && net.session.link && net.session.link.setBusy) {
				net.session.link.setBusy(false);
			}

			var acts = [Math.trunc(myAct), netPeerAct];
			var mi = (intents && intents.myIntent) ? intents.myIntent : (netMyIntent || {});
			var pi = netPeerIntent || {};

			/* 猜点：写进状态，结算时从快照里读（本地 0 = 我，1 = 对手） */
			state.guess[0] = (mi.guess !== undefined && mi.guess >= 0) ? Math.trunc(mi.guess) : -1;
			state.guess[1] = (pi.guess !== undefined && pi.guess >= 0) ? Math.trunc(pi.guess) : -1;

			/* 豪赌押注值：写在**押注者自己**的 counters 里。
			 * counters.gamble 回合末不清，所以两端只要写的是同一个人的值，
			 * 指纹就永远对得上（翻转座位后正好对齐）。 */
			if (mi.gamble && mi.gambleGuess >= 0) state.counters[0]['gamble'] = Math.trunc(mi.gambleGuess);
			if (pi.gamble && pi.gambleGuess >= 0) state.counters[1]['gamble'] = Math.trunc(pi.gambleGuess);

			/* 穿透 / 豪赌：resolve_turn 一次只认一个发起者。双方同回合都发动时，
			 * 按**绝对座位**裁决（房主优先）—— 若按「我优先」，两端的「我」
			 * 正好相反，第一回合就会算出两套局面，指纹立刻不一致。 */
			var opt = { pierceBy: -1, gambleBy: -1 };
			opt.pierceBy = pickBySeat(!!mi.pierce, !!pi.pierce);
			opt.gambleBy = pickBySeat(!!mi.gamble, !!pi.gamble);

			co = new Runner(playAndResolve(acts, opt));
		}

		/**
		 * 双方同回合都发动同一个主动技能时，选一个发起者。
		 * 规则：绝对座位号小的优先（房主=0 优先），两端算出同一个人。
		 * @param mine 我发动了吗  @param peer 对手发动了吗
		 * @return 本地座位索引（0=我 1=对手），都不发动返回 -1
		 */
		function pickBySeat(mine, peer) {
			if (!mine && !peer) return -1;
			if (mine && !peer) return 0;
			if (!mine && peer) return 1;
			/* 都发动：房主（绝对座位 0）优先。我在本地永远是 0 号，
			 * 所以我是不是房主决定房主在本地是 0 号还是 1 号。 */
			return (netMySeat === 0) ? 0 : 1;
		}

		/* ---------------- 演出 ---------------- */

		function* playAndResolve(acts, opt) {
			actsCache = acts;
			clearCards();
			ghosts = false;

			// ① 玩家这一手：手牌 → 中央 → 翻扣 → 落进牌槽
			yield* animPlayerPlay(Math.trunc(acts[0]));

			// ② 其余座位依次扣下
			for (var i = 1; i < n; i++) {
				spawnFoeSlot(i, Math.trunc(acts[i]));
				yield new Wait(0.09);
			}
			yield new Wait(FLIP_HOLD);

			// ③ 一起翻开
			hint = '翻开';
			flipAll();
			yield new Wait(0.36);

			// ③.5 调换（1v1 一次性）：需要出牌前先按「调换」待命，
			//     亮牌后才开 15 秒窗口 —— 不待命就不打断节奏，避免每回合白停 15 秒。
			if (n === 2 && swapArmed && !over && RC.can_use(state, 0, SK.Id.DIAOHUAN)) {
				swapArmed = false;
				swapGate = new Gate();
				swapLeft = SWAP_SECONDS;
				picker = { on: true, mode: 'swap', sel: -1 };
				hint = '调换 · 可以换一张';
				yield swapGate;
				swapGate = null;
				swapLeft = 0;
				picker.on = false;
			}
			swapArmed = false;

			// ④ 结算
			var prev = [];
			for (var p = 0; p < n; p++) {
				prev.push([
					Math.trunc(state.hp[p]), Math.trunc(state.energy[p]), Math.trunc(state.shield[p]),
				]);
			}

			var res;
			if (n === 2) {
				res = RC.resolve_turn(state, acts[0], acts[1], opt.pierceBy, opt.gambleBy);
				if (res.winner === -1 && res.outcome !== RC.Outcome.ONGOING) {
					if (res.outcome === RC.Outcome.WIN_P1) res.winner = 0;
					else if (res.outcome === RC.Outcome.WIN_P2) res.winner = 1;
					else res.winner = -2;
				}
			} else {
				res = RC.resolve_round(state, acts);
			}
			state = res.state;
			refreshAll();
			/* 联机：结算完立刻上报局面指纹。
			 * 这是「防改内存」的最后一道关 —— 只要有一边偷偷改了状态，
			 * 两边的哈希立刻对不上，同步层会抛 desync。 */
			if (net && net.session && net.session.markHash) {
				net.session.markHash(roundNo, state);
			}
			feedback(res.events, acts);

			var winner = Math.trunc(res.winner);
			if (winner >= 0 || winner === -2) {
				yield new Wait(1.0);
				showResult(winner);
				return;
			}
			yield new Wait(0.7);
			beginRound();
		}

		function* animPlayerPlay(act) {
			if (act === RC.Action.PASS) {
				addFloat([W * 0.5, lay.slotCy], '空过', S.C.INK3, 0);
				yield new Wait(0.2);
				return;
			}
			var idx = actions.indexOf(act);
			if (idx < 0) { yield new Wait(0.2); return; }

			hand[idx].alpha = 0.32;
			var fc = {
				cx: HAND_X + idx * HAND_STEP + CW * 0.5,
				cy: lay.handY + CH * 0.5,
				sx: 0.92, sy: 0.92,
				faceDown: false,
				act: act,
			};
			fly = fc;

			var x0 = fc.cx;
			var y0 = fc.cy;
			var x1 = W * 0.5;
			var y1 = lay.slotTop + CH * 0.5;

			yield new All([
				new Tw(0.24, 'cubicOut', function (p) { fc.cx = lerp(x0, x1, p); fc.cy = lerp(y0, y1, p); }),
				new Tw(0.24, 'linear', function (p) { fc.sx = 0.92 + 0.20 * p; fc.sy = 0.92 + 0.20 * p; }),
			]);
			yield new Tw(0.08, 'linear', function (p) { fc.sx = 1.12 * (1.0 - p); });
			fc.faceDown = true;
			yield new Tw(0.10, 'linear', function (p) { fc.sx = 1.12 * p; });

			var ax = fc.cx;
			var ay = fc.cy;
			var lx = W * 0.5;
			var ly = lay.slotCy;
			yield new All([
				new Tw(0.18, 'cubicIn', function (p) { fc.cx = lerp(ax, lx, p); fc.cy = lerp(ay, ly, p); }),
				new Tw(0.18, 'linear', function (p) { fc.sx = 1.12 - 0.12 * p; fc.sy = 1.12 - 0.12 * p; }),
			]);

			fly = null;
			playerSlot = { cx: lx, cy: ly, sx: 1.0, sy: 1.0, faceDown: true, act: act };
		}

		function spawnFoeSlot(seat, act) {
			var s = seats[seat - 1];
			if (!s) return;
			s.card = null;
			if (act === RC.Action.PASS) return;
			// 对手牌按 0.62 缩放，牌心 = 牌顶 + 半张缩小后的牌高；
			// 之前这里用了整张牌的半高，牌会整体压低 30px，正好吃掉与玩家牌的间距。
			var cy0 = lay.foeCardY + CH * FOE_SCALE * 0.5;
			var card = {
				cx: s.cx,
				cy: cy0 - 14.0 * FOE_SCALE,
				sx: FOE_SCALE, sy: FOE_SCALE,
				faceDown: true,
				act: act,
				alpha: 0.0,
			};
			s.card = card;
			anims.push(new Runner((function* () {
				yield new All([
					new Tw(0.16, 'linear', function (p) {
						card.cy = (cy0 - 14.0 * FOE_SCALE) + 14.0 * FOE_SCALE * p;
					}),
					new Tw(0.16, 'linear', function (p) { card.alpha = p; }),
				]);
			})()));
		}

		function flipAll() {
			if (playerSlot) flipOne(playerSlot, Math.trunc(actsCache[0]), 1.0);
			for (var i = 1; i < n; i++) {
				var s = seats[i - 1];
				if (s && s.card) flipOne(s.card, Math.trunc(actsCache[i]), FOE_SCALE);
			}
		}

		function flipOne(card, act, target) {
			anims.push(new Runner((function* () {
				yield new Tw(0.09, 'linear', function (p) { card.sx = target * (1.0 - p); });
				card.faceDown = false;
				card.act = act;
				yield new Tw(0.11, 'linear', function (p) { card.sx = target * p; });
				card.sx = target;
			})()));
		}

		/* ---------------- 结算反馈 ---------------- */

		function feedback(events, acts) {
			var names = [];
			for (var i = 0; i < n; i++) names.push(who(i) + '·' + shortName(Math.trunc(acts[i])));
			logLine('第 ' + roundNo + ' 回合  ' + names.join(' / '));

			var seq = 0;
			var keys = [];
			var damaged = 0;

			/* 数值节拍：与浮字同一个 seq，浮字冒出来的同一刻数字开始走 */
			function at(delay, fn) { sched(delay, fn); }
			function d(seqIdx) { return seqIdx * 0.07; }

			for (var e = 0; e < events.length; e++) {
				var ev = events[e];
				var tp = String(ev.type);

				if (tp === 'reveal' || tp === 'outcome') continue;

				if (tp === 'energy') {
					/* 能量事件带最终值：豆数跟着一起变 */
					var e0 = Math.trunc(ev.p1), e1 = Math.trunc(ev.p2);
					at(d(seq), function () {
						if (n > 0) vt.energy[0] = e0;
						if (n > 1) vt.energy[1] = e1;
					});
					seq++;
					continue;
				}

				if (tp === 'block') {
					addFloat(posOf(ev.attacker), '防住', S.C.INK3, seq++);
					keys.push(who(ev.attacker) + ' 的' + shortName(Math.trunc(acts[ev.attacker])) + '被挡下');
					sparkAt(ev.attacker, 0.6);
				} else if (tp === 'cancel') {
					addFloat([W * 0.5, lay.slotTop - 26], '同牌互抵', S.C.INK3, seq++);
					keys.push('同牌互抵，双方照扣豆');
				} else if (tp === 'overpower') {
					if (ev.by !== undefined) {
						addFloat(posOf(ev.by), '压制', S.C.INK, seq++);
						addFloat(posOf(ev.target), '掏失效', S.C.INK3, seq++);
						keys.push(who(ev.by) + ' 鬼刀压制 ' + who(ev.target) + ' 的掏');
					} else {
						var lose = (ev.winner === 0) ? 1 : 0;
						addFloat(posOf(ev.winner), '压制', S.C.INK, seq++);
						addFloat(posOf(lose), '掏失效', S.C.INK3, seq++);
						keys.push(who(ev.winner) + ' 鬼刀压制 ' + who(lose) + ' 的掏');
					}
					haptic('heavy');
					sparkAt(ev.winner === undefined ? 0 : ev.winner, 1.0);
				} else if (tp === 'interrupt') {
					addFloat(posOf(ev.target), '打断', S.C.INK2, seq++);
					keys.push(who(ev.target) + ' 的' + shortName(Math.trunc(acts[ev.target])) + '被打断');
				} else if (tp === 'damage') {
					var tg = ev.target, amt = Math.trunc(ev.amount);
					addFloat(posOf(tg), '−' + fmt(amt), S.C.DANGER, seq);
					at(d(seq), function () {
						vt.hp[tg] = Math.max(0, vt.hp[tg] - amt);
						shake = Math.min(1, shake + amt / 12);
					});
					/* 攻击命中的粒子碎裂 */
					at(d(seq) + 0.02, function () { burst(tg, amt); });
					seq++;
					if (tg === 0) { stats.taken += amt; haptic('heavy'); }
					else { stats.dmg += amt; haptic('light'); }
					damaged += amt;
				} else if (tp === 'heal') {
					var ht = ev.target, ha = Math.trunc(ev.amount);
					addFloat(posOf(ht), '+' + fmt(ha), S.C.OK, seq);
					at(d(seq), function () {
						var cap = Math.max(Math.trunc(state.max_hp[ht]), 1);
						vt.hp[ht] = Math.min(cap, vt.hp[ht] + ha);
					});
					seq++;
					if (ht === 0) stats.heal += ha;
				} else if (tp === 'reflect') {
					addFloat(posOf(ev.target), '反伤 ' + fmt(ev.amount), S.C.INK2, seq++);
					keys.push(who(ev.target) + ' 受到反伤');
				} else if (tp === 'shield') {
					var st2 = ev.target, sa = Math.trunc(ev.amount);
					addFloat(posOf(st2), '盾 −' + fmt(sa), S.C.INK2, seq);
					at(d(seq), function () { vt.shield[st2] = Math.max(0, vt.shield[st2] - sa); });
					seq++;
				} else if (tp === 'dodge') {
					addFloat(posOf(ev.target), '闪避', S.C.INK, seq++);
					keys.push(who(ev.target) + ' 闪避了一次伤害');
				} else if (tp === 'immune') {
					addFloat(posOf(ev.target), '金身', S.C.INK, seq++);
					keys.push(who(ev.target) + ' 金身免伤');
				} else if (tp === 'revive') {
					var rt = ev.target;
					addFloat(posOf(rt), '复活', S.C.INK, seq++);
					at(d(seq), function () {
						vt.hp[rt] = Math.min(Math.max(Math.trunc(state.max_hp[rt]), 1), 4);
					});
				} else if (tp === 'pierce') {
					var pt = ev.target, pa = Math.trunc(ev.amount);
					addFloat(posOf(pt), '穿透 ' + fmt(pa), S.C.INK, seq);
					at(d(seq), function () { vt.hp[pt] = Math.max(0, vt.hp[pt] - pa); });
					at(d(seq) + 0.02, function () { burst(pt, pa); });
					seq++;
					keys.push('穿透真伤 ' + fmt(pa));
				} else if (tp === 'gamble') {
					if (ev.hit) {
						addFloat(posOf(ev.by), '豪赌命中', S.C.INK, seq++);
						keys.push('豪赌命中，' + fmt(ev.amount) + ' 点真伤');
					} else {
						addFloat(posOf(ev.by), '豪赌失手', S.C.DANGER, seq++);
						keys.push('豪赌失手，' + who(ev.by) + ' 当场死亡');
						at(d(seq), function () { vt.hp[ev.by] = 0; });
					}
				} else if (tp === 'guess') {
					addFloat(posOf(ev.target), ev.hit ? ('猜中 ' + ev.hits) : '猜错', S.C.INK3, seq++);
				} else if (tp === 'sacrifice') {
					keys.push(who(ev.by) + ' 献祭：付 ' + fmt(ev.hp) + ' 血偷 1 豆');
				} else if (tp === 'focus') {
					keys.push(who(ev.by) + ' 开启金身');
				} else if (tp === 'ban') {
					keys.push(who(ev.by) + ' 禁豆：对手 2 回合不能回');
				}
			}

			/* 收尾：把显示值对齐到结算后的真值（避免逐事件累加与规则结果有 1 点误差） */
			at(seq * 0.07 + 0.12, function () {
				for (var i = 0; i < n; i++) {
					vt.hp[i] = Math.trunc(state.hp[i]);
					vt.energy[i] = Math.trunc(state.energy[i]);
					vt.shield[i] = Math.trunc(state.shield[i]);
				}
			});

			if (keys.length > 0) logLine(keys.slice(0, 2).join(' · '));
			else if (damaged === 0) logLine('本回合无伤');
		}

		/* 攻击命中：在目标位置炸开粒子 */
		function burst(seat, amount) {
			var p = posOf(seat);
			var power = clamp(Math.trunc(amount) / 8, 0.5, 2.0);
			fx.impact(p[0], p[1], seat === 0 ? S.C.DANGER : S.C.INK, power);
		}

		/* 被压制 / 被挡下：轻量火花 */
		function sparkAt(seat, power) {
			var p = posOf(seat);
			fx.impact(p[0], p[1], S.C.INK3, (power || 1) * 0.5);
		}

		function showResult(winner) {
			over = true;
			busy = true;
			var title = '平局';
			var sub = '30 回合内未分胜负';
			if (winner === 0) {
				title = '胜  利';
				sub = '第 ' + roundNo + ' 回合';
			} else if (winner > 0) {
				title = '失  败';
				sub = (net ? '对手' : ('AI ' + winner)) + ' 获胜 · 第 ' + roundNo + ' 回合';
			} else if (winner === -1) {
				title = '连 接 中 断';
				sub = '对手已离开 · 第 ' + roundNo + ' 回合';
			} else if (winner === -3) {
				title = '已 认 输';
				sub = '第 ' + roundNo + ' 回合';
			}
			overlay = { on: true, title: title, sub: sub };
			if (typeof t.onOver === 'function') t.onOver(winner);
		}

		function surrender() {
			if (over) return;
			showResult(-3);
		}

		/* ---------------- 主动技能 ---------------- */

		function chipList() {
			var out = [];
			if (!state || over) return out;
			var solo = (n === 2);
			var idle = !busy;
			/* 联机：只有「能跟着牌一起承诺」的主动技能能开
			 * （猜点 / 穿透 / 豪赌）。献祭、金身、禁豆、调换是纯本地状态改动，
			 * 对方无从知晓，两端会算出不同局面 → 只能单机用。 */
			var netSafe = !net;

			if (hasSkill(0, SK.Id.CHUANTOU)) {
				out.push({
					id: SK.Id.CHUANTOU,
					label: pierceArmed ? '穿透·确认' : '穿透',
					on: solo && idle && RC.can_use(state, 0, SK.Id.CHUANTOU),
				});
			}
			if (hasSkill(0, SK.Id.XIANJI)) {
				out.push({
					id: SK.Id.XIANJI, label: '献祭',
					on: netSafe && solo && idle && RC.can_sacrifice(state, 0),
				});
			}
			if (hasSkill(0, SK.Id.QUANSHEN)) {
				out.push({
					id: SK.Id.QUANSHEN, label: '金身',
					on: netSafe && idle && RC.can_use(state, 0, SK.Id.QUANSHEN),
				});
			}
			if (hasSkill(0, SK.Id.JINDOU)) {
				out.push({
					id: SK.Id.JINDOU, label: '禁豆',
					on: netSafe && solo && idle && RC.can_use(state, 0, SK.Id.JINDOU),
				});
			}
			if (hasSkill(0, SK.Id.CAIDIAN)) {
				out.push({
					id: SK.Id.CAIDIAN,
					label: guessSel >= 0 ? ('猜·' + shortName(guessSel)) : '猜点',
					on: idle,
					info: true,
				});
			}
			if (hasSkill(0, SK.Id.HAODU)) {
				out.push({
					id: SK.Id.HAODU, label: '豪赌',
					on: solo && idle && RC.can_gamble(state, 0),
				});
			}
			if (hasSkill(0, SK.Id.DIAOHUAN)) {
				out.push({
					id: SK.Id.DIAOHUAN,
					label: swapArmed ? '调换·待亮牌' : '调换',
					on: netSafe && ((solo && idle && RC.can_use(state, 0, SK.Id.DIAOHUAN)) || (swapArmed && idle)),
					info: !swapArmed,
				});
			}
			return out;
		}

		function chipGeom(cnt) {
			if (cnt <= 0) return { cw: 0, x0: 0 };
			var cw = Math.min(122, (W - 48 - (cnt - 1) * 8) / cnt);
			var total = cnt * cw + (cnt - 1) * 8;
			return { cw: cw, x0: (W - total) * 0.5 };
		}

		function tapChip(chip) {
			if (!chip.on) return;
			if (chip.id === SK.Id.DIAOHUAN) {
				swapArmed = !swapArmed;
				hint = swapArmed ? '已待命：亮牌后可换一张（15 秒）' : '选择一张牌';
				return;
			}
			if (chip.id === SK.Id.CHUANTOU) {
				if (!pierceArmed) {
					pierceArmed = true;
					hint = '再点一次「穿透」确认发动（本回合视为空过）';
					return;
				}
				submit(RC.Action.PASS, 0, -1);
				return;
			}
			if (chip.id === SK.Id.XIANJI) {
				var evs = RC.do_sacrifice(state, 0);
				if (evs.length) {
					addFloat(posOf(0), '−1', S.C.DANGER, 0);
					addFloat([W * 0.5 + 90, lay.statusTop + 26], '+1 豆', S.C.OK, 1);
					logLine('献祭：付 1 点血，偷对手 1 颗豆');
					haptic('light');
					refreshAll();
				}
				return;
			}
			if (chip.id === SK.Id.QUANSHEN) {
				RC.do_focus(state, 0);
				addFloat(posOf(0), '金身', S.C.INK, 0);
				logLine('金身：本回合免伤，但天赋全失效');
				refreshAll();
				return;
			}
			if (chip.id === SK.Id.JINDOU) {
				RC.do_ban_bean(state, 0);
				logLine('禁豆：对手之后 2 回合不能「回」');
				refreshAll();
				return;
			}
			if (chip.id === SK.Id.CAIDIAN) { openPicker('guess'); return; }
			if (chip.id === SK.Id.HAODU) { openPicker('gamble'); return; }
		}

		function orderAll() {
			return [
				RC.Action.HUI, RC.Action.TAO, RC.Action.GUIDAO,
				RC.Action.YAOPAO, RC.Action.FANG_TAO, RC.Action.FANG_GUIDAO,
				RC.Action.PASS,
			];
		}

		function pickerCells() {
			var out = [];
			if (picker.mode === 'swap') {
				var legal = RC.legal_actions(state, 0);
				var cur = Math.trunc(actsCache[0]);
				for (var i = 0; i < legal.length; i++) {
					var a = Math.trunc(legal[i]);
					if (a === cur) continue;
					if (a === RC.Action.PASS) continue;
					out.push(a);
				}
				return out;
			}
			return orderAll();
		}

		function pickerGeom() {
			var cells = pickerCells();
			// 格子少的时候（例如调换只剩 2 张可换）让它们拉满一行，右侧不留空档
			var cols = Math.max(1, Math.min(4, cells.length));
			var rows = Math.max(1, Math.ceil(cells.length / cols));
			var w = W - 48;
			var cw = (w - 16 - (cols - 1) * 8) / cols;
			var h = 10 + 24 + rows * 54 + (rows - 1) * 8 + 12 + 44 + 14;
			var y = lay.handY - 12 - h;
			if (y < TOP + 30) y = TOP + 30;
			return { x: 24, y: y, w: w, h: h, cw: cw, ch: 54, rows: rows, cols: cols };
		}

		function openPicker(mode) {
			picker = { on: true, mode: mode, sel: -1 };
			hint = (mode === 'guess') ? '猜点：选出你预测的对手出牌'
				: (mode === 'gamble') ? '豪赌：猜中 X 点伤害，猜错当场死亡'
					: '调换：换一张牌（对手会知道）';
		}

		function choosePicker(i) {
			var cells = pickerCells();
			if (i < 0 || i >= cells.length) return;
			var a = Math.trunc(cells[i]);
			if (picker.mode === 'guess') {
				guessSel = a;
				picker = { on: false, mode: 'guess', sel: -1 };
				hint = '猜点：对手这手出「' + cardTitle(a) + '」';
				return;
			}
			if (picker.mode === 'gamble') {
				picker = { on: false, mode: 'guess', sel: -1 };
				logLine('豪赌：押对手出「' + cardTitle(a) + '」，弃掉全部豆');
				/* 联机：押注值不能直接写进本地局面（对端还不知道），
				 * 必须跟着这一手的承诺一起发出去、摊牌时一起验。
				 * 和单机一致：豪赌这一手按「空过」算。 */
				if (net) {
					netGambleGuess = a;
					submit(RC.Action.PASS);
					return;
				}
				state.counters[0]['gamble'] = a;
				submit(RC.Action.PASS, -1, 0);
				return;
			}
			if (picker.mode === 'swap') {
				RC.mark_swap_used(state, 0);
				actsCache[0] = a;
				if (playerSlot) flipOne(playerSlot, a, 1.0);
				addFloat(posOf(0), '调换', S.C.INK, 0);
				logLine('你调换了出牌（对手已看到）');
				hint = '结算';
				picker.on = false;
				if (swapGate) swapGate.open = true;
			}
		}

		function closePicker() {
			if (picker.mode === 'swap') return;  // 调换靠倒计时或「不换」结束
			picker = { on: false, mode: 'guess', sel: -1 };
			hint = '选择一张牌';
		}

		/* ---------------- 每帧 ---------------- */

		function update(dt) {
			for (var i = 0; i < seats.length; i++) seats[i].spin += dt * U.SPEED;

			/* ---- 联机：驱动同步层与轮询 ---- */
			if (net) {
				if (net.session && net.session.tick) net.session.tick(dt);
				if (net.session && net.session.link && net.session.link.tick) {
					net.session.link.tick(dt);
				}
				/* 断线：不能静默卡死，直接判负 */
				if (netBroken && !over) {
					netBroken = false;
					showResult(-1);
					return;
				}
			}

			// 倒计时即使在技能弹窗打开时也照走：超时自动收起弹窗并按空过结算，
			// 否则玩家开着「猜点」不选就会把一局卡死在这里。
			var paused = over || busy;
			if (!(state === null || paused)) {
				countdown -= dt;
				timeStr = String(Math.max(Math.trunc(Math.ceil(countdown)), 0));
				timeDanger = countdown <= 5.0;
				if (countdown <= 0.0) {
					if (picker.on && picker.mode !== 'swap') {
						picker = { on: false, mode: 'guess', sel: -1 };
					}
					submit(RC.Action.PASS);
				}
			}

			/* 联机：我已交牌，但对手迟迟不来 —— 兜底摊牌 + 超时判负，
			 * 不能让整局无限期挂着。 */
			if (net && netPending && !over) {
				netWait += dt;
				timeStr = String(Math.max(Math.trunc(Math.ceil(30 - netWait)), 0));
				timeDanger = (30 - netWait) <= 5.0;
				if (netWait >= 30.0) {
					net.session.forceReveal();
					netWait = 0;
				}
				if (netWait >= 45.0) {
					netBroken = true;
					netWait = 0;
				}
			} else if (!netPending) {
				netWait = 0;
			}

			if (swapGate) {
				swapLeft -= dt;
				if (swapLeft <= 0) {
					swapLeft = 0;
					picker.on = false;
					swapGate.open = true;
				}
			}

			if (menuArmed > 0) menuArmed -= dt;

			if (co !== null) {
				if (co.step(dt)) co = null;
			}
			for (var k = anims.length - 1; k >= 0; k--) {
				if (anims[k].step(dt)) anims.splice(k, 1);
			}

			/* 结算时间轴：按与浮字相同的节拍推进数值 */
			tNow += dt;
			for (var s2 = steps.length - 1; s2 >= 0; s2--) {
				if (steps[s2].at <= tNow) {
					var fn = steps[s2].fn;
					steps.splice(s2, 1);
					fn();
				}
			}

			/* 显示值向目标值缓动 —— 数字是「走」过去的，不是「跳」过去的。
			 * 指数缓动永远差一点点，所以差得够近就直接吸附，
			 * 否则玩家会看到「11/24」而实际是 10。 */
			if (state !== null) {
				var rate = clamp(dt * 14, 0, 1);
				for (var v = 0; v < n; v++) {
					view.hp[v] = approach(view.hp[v], vt.hp[v], rate, 0.5);
					view.energy[v] = approach(view.energy[v], vt.energy[v], rate, 0.4);
					view.shield[v] = approach(view.shield[v], vt.shield[v], rate, 0.4);
				}
				/* 对手阵亡 → 立方体破碎 */
				for (var d = 1; d < n; d++) {
					if (vt.hp[d] <= 0 && !deadShown[d]) {
						deadShown[d] = true;
						var seat = seats[d - 1];
						if (seat) {
							fx.shatterCube(seat.cx, seat.cy, seat.rad, seat.color,
								seat.spin, TILT);
							haptic('heavy');
						}
					} else if (vt.hp[d] > 0 && deadShown[d]) {
						deadShown[d] = false;
					}
				}
				/* 玩家阵亡 */
				if (vt.hp[0] <= 0 && !deadShown[0]) {
					deadShown[0] = true;
					fx.impact(W * 0.5, lay.slotCy, S.C.DANGER, 2.0);
				} else if (vt.hp[0] > 0 && deadShown[0]) {
					deadShown[0] = false;
				}
			}

			if (shake > 0) shake = Math.max(0, shake - dt * 3.2);
			fx.update(dt);

			for (var f = floats.length - 1; f >= 0; f--) {
				var fl = floats[f];
				fl.t += dt;
				if (fl.t < 0) continue;
				fl.a = 1.0 - clamp((fl.t - 0.28) / 0.62, 0.0, 1.0);
				fl.dy = -48.0 * EASE('cubicOut', Math.min(1, fl.t / 0.8));
				if (fl.t >= 0.92) floats.splice(f, 1);
			}
		}

		/* ---------------- 绘制 ---------------- */

		function drawGhosts(ctx) {
			ctx.save();
			ctx.lineWidth = 1.5;
			ctx.strokeStyle = '#e0e0e0';
			ctx.strokeRect(W * 0.5 - CW * 0.5, lay.slotTop, CW, CH);
			var w = CW * FOE_SCALE;
			var h = CH * FOE_SCALE;
			for (var i = 0; i < seats.length; i++) {
				// foeCardY 是「牌顶」，缩小的对手牌就从这里往下长，不再垂直居中
				ctx.strokeRect(seats[i].cx - w * 0.5, lay.foeCardY, w, h);
			}
			ctx.restore();
		}

		function drawBeans(ctx) {
			var e = Math.round(view.energy[0]);
			var step = 30;
			var left = W - 28 - (RC.MAX_ENERGY * step);
			// 小标签：不写「豆」，8 个圈圈会被当成血条
			S.text(ctx, '豆', left - 6, lay.statusTop + 24, 12, S.C.INK3, 'right');
			for (var i = 0; i < RC.MAX_ENERGY; i++) {
				var cx = left + step * 0.5 + i * step;
				var cy = lay.statusTop + 20;
				if (i < e) S.circle(ctx, cx, cy, 9.0, S.C.INK);
				else ring(ctx, cx, cy, 8.0, S.C.LINE2, 1.2);
			}
		}

		function drawSeatBeans(ctx, s) {
			var e = Math.round(view.energy[s.i]);
			var left = s.cx - 56;
			for (var i = 0; i < RC.MAX_ENERGY; i++) {
				var cx = left + 6 + i * 13;
				var cy = s.infoY + 39;
				if (i < e) S.circle(ctx, cx, cy, 4.2, S.C.INK2);
				else ring(ctx, cx, cy, 3.6, S.C.LINE2, 1.0);
			}
		}

		function drawChips(ctx) {
			var list = chipList();
			if (list.length === 0) return;
			var gm = chipGeom(list.length);
			for (var i = 0; i < list.length; i++) {
				var c = list[i];
				var x = gm.x0 + i * (gm.cw + 8);
				var armed = (c.id === SK.Id.CHUANTOU && pierceArmed);
				var border = (c.on || armed) ? S.C.INK : S.C.LINE2;
				var fg = armed ? S.C.BG : (c.on ? S.C.INK : S.C.INK3);
				S.box(ctx, x, lay.skillBarY, gm.cw, lay.chipH, 10,
					armed ? S.C.INK : S.C.BG, border, 1);
				S.textCenter(ctx, c.label, x, lay.skillBarY + 23 + 4.6, gm.cw, 12.5, fg);
			}
		}

		function drawPicker(ctx) {
			if (!picker.on) return;
			var gm = pickerGeom();
			var cells = pickerCells();

			ctx.save();
			// 只做一层薄白纱：既要压住底下的牌桌，又不能把整屏洗成一片白
			ctx.fillStyle = 'rgba(255,255,255,0.45)';
			ctx.fillRect(0, 0, W, H);
			ctx.restore();

			// 白色描边环 + 黑框：靠两层边框把面板从背景里拎出来，不加阴影
			S.box(ctx, gm.x - 9, gm.y - 9, gm.w + 18, gm.h + 18, 21, S.C.BG, null, 0);
			S.box(ctx, gm.x, gm.y, gm.w, gm.h, 14, S.C.BG, S.C.INK, 1.5);

			var title = picker.mode === 'guess' ? '猜点 · 对手这手出什么'
				: picker.mode === 'gamble' ? '豪赌 · 猜错当场死亡'
					: '调换 · 换一张牌';
			S.text(ctx, title, gm.x + 16, gm.y + 10 + 16, 14, S.C.INK);

			if (picker.mode === 'swap') {
				S.text(ctx, Math.max(0, Math.ceil(swapLeft)) + ' 秒', gm.x + gm.w - 16,
					gm.y + 10 + 16, 13, S.C.INK3, 'right');
			}

			var y0 = gm.y + 10 + 24;
			for (var i = 0; i < cells.length; i++) {
				var r = Math.floor(i / gm.cols);
				var c = i % gm.cols;
				var x = gm.x + 8 + c * (gm.cw + 8);
				var y = y0 + r * (gm.ch + 8);
				var a = Math.trunc(cells[i]);
				S.box(ctx, x, y, gm.cw, gm.ch, 9, S.C.BG, S.C.LINE2, 1);
				S.textCenter(ctx, cardTitle(a), x, y + gm.ch * 0.5 + 6, gm.cw, 15, S.C.INK);
			}

			var byY = y0 + gm.rows * (gm.ch + 8) + 2;
			var label = (picker.mode === 'swap') ? '不换' : '取消';
			S.button(ctx, gm.x + 8, byY, gm.w - 16, 44, label, 'normal', 'line', 15);
		}

		function draw(ctx) {
			ctx.save();
			ctx.fillStyle = S.C.BG;
			ctx.fillRect(0, 0, W, H);
			ctx.restore();

			if (state === null) { hint = '选择一张牌'; return; }

			/* 受击震屏：轻微偏移，不加模糊 */
			if (shake > 0.001) {
				var amp = shake * 7.0;
				ctx.save();
				ctx.translate(rand(-amp, amp), rand(-amp, amp));
			}

			if (ghosts && !picker.on) drawGhosts(ctx);

			// 顶栏
			S.text(ctx, '第 ' + roundNo + ' 回合', 28, lay.headerY + 15, 15, S.C.INK2);
			S.text(ctx, timeStr, W - 28, lay.headerY + 15, 15,
				timeDanger ? S.C.DANGER : S.C.INK2, 'right');
			S.rule(ctx, 28, lay.ruleY, W - 56, S.C.LINE);

			// 对手
			for (var i = 0; i < seats.length; i++) {
				var s = seats[i];
				/* 血条宽度跟着显示值走：数字在动，条也在动 */
				var dcap = Math.max(Math.trunc(state.max_hp[s.i]), 1);
				s.barW = 96.0 * clamp(Math.round(view.hp[s.i]) / dcap, 0.0, 1.0);
				s.alive = view.hp[s.i] > 0.5;
				/* 阵亡：立方体已经碎成碎片飞走了，不再画本体 */
				if (s.alive) U.draw(ctx, s.cx, s.cy, s.rad, s.color, s.spin, TILT, true);
				S.textCenter(ctx, s.name, s.cx - 90, s.infoY + 13, 180, 13, S.C.INK2);
				ctx.save();
				ctx.fillStyle = S.C.LINE;
				ctx.fillRect(s.cx - 48, s.infoY + 24, 96, 3);
				ctx.fillStyle = S.C.INK;
				ctx.fillRect(s.cx - 48, s.infoY + 24, s.barW, 3);
				ctx.restore();
				drawSeatBeans(ctx, s);
				drawCard(ctx, s.card);
			}

			// 玩家牌槽
			if (n >= 3) {
				// 混战时中间的对手和我在同一列，标一下哪个是我的牌
				S.textCenter(ctx, '你', W * 0.5 - 40, lay.slotTop - 7, 80, 11, S.C.INK3);
			}
			drawCard(ctx, playerSlot);

			// 玩家状态（显示值：随结算事件实时走）
			var hp = Math.round(view.hp[0]);
			var cap = Math.max(Math.trunc(state.max_hp[0]), 1);
			var hpStr = fmt(hp);
			S.text(ctx, hpStr, 32, lay.statusTop + 24, 24, S.C.INK);
			ctx.save();
			ctx.font = S.font(24, 400);
			var hpW = ctx.measureText(hpStr).width;
			ctx.restore();
			S.text(ctx, '/ ' + fmt(cap), 32 + hpW + 8, lay.statusTop + 24, 12, S.C.INK3);
			var sh = Math.round(view.shield[0]);
			if (sh > 0) S.text(ctx, '护盾 ' + fmt(sh), 32, lay.statusTop + 54, 14, S.C.INK3);
			var sk = SK.text_of(state.skills[0]);
			if (sk) S.text(ctx, clipText(ctx, sk, 13, W - 200), 32, lay.statusTop + 86, 13, S.C.INK3);
			drawBeans(ctx);

			// 提示
			S.textCenter(ctx, hint, 0, lay.hintY + 15, W, 15, S.C.INK3);

			// 战报
			var maxLines = logMaxLines();
			var start = Math.max(0, logs.length - maxLines);
			for (var q = start; q < logs.length; q++) {
				var line = clipText(ctx, logs[q], 11.5, W - 64);
				S.text(ctx, line, 32, lay.logY + 12 + (q - start) * 18, 11.5, S.C.INK3);
			}

			// 主动技能
			drawChips(ctx);

			// 手牌
			for (var h = 0; h < hand.length; h++) {
				var c = hand[h];
				if (c.alpha < 1) { ctx.save(); ctx.globalAlpha = c.alpha; }
				K.draw(ctx, HAND_X + h * HAND_STEP, lay.handY, {
					title: cardTitle(c.act),
					note: cardNote(c.act),
					icon: cardIcon(c.act),
					dim: c.dim,
				});
				if (c.alpha < 1) ctx.restore();
			}

			// 底部按钮
			S.button(ctx, W * 0.5 - 210, lay.footY, 200, 46,
				menuArmed > 0 ? '再点退出' : '菜  单', 'normal', 'line', 15);
			S.button(ctx, W * 0.5 + 10, lay.footY, 200, 46, '认  输', 'normal', 'line', 15);

			// 浮动数字
			for (var f = 0; f < floats.length; f++) {
				var fl = floats[f];
				if (fl.a <= 0) continue;
				ctx.save();
				ctx.globalAlpha = fl.a;
				S.textCenter(ctx, fl.text, fl.x - 60, fl.y - 14 + fl.dy + fl.size, 120, fl.size, fl.col);
				ctx.restore();
			}

			// 粒子 / 破碎特效（画在浮字之下、牌之上）
			fx.draw(ctx);

			drawCard(ctx, fly);
			drawPicker(ctx);

			if (shake > 0.001) ctx.restore();

			// 结算层
			if (overlay.on) {
				ctx.save();
				ctx.fillStyle = S.C.BG;
				ctx.fillRect(0, 0, W, H);
				ctx.restore();
				var midY = overlayTop();
				S.textCenter(ctx, overlay.title, 0, midY + 46, W, 46, S.C.INK);
				S.textCenter(ctx, overlay.sub, 0, midY + 84, W, 14, S.C.INK3);
				S.rule(ctx, W * 0.5 - 120, midY + 108, 240, S.C.LINE);
				S.textCenter(ctx, '输出 ' + fmt(stats.dmg) + '　承受 ' + fmt(stats.taken) +
					'　治疗 ' + fmt(stats.heal), 0, midY + 140, W, 13, S.C.INK2);
				S.button(ctx, W * 0.5 - 160, midY + 186, 320, 54, '再 来 一 局', 'normal', 'solid', 17);
				S.button(ctx, W * 0.5 - 160, midY + 256, 320, 52, '返回菜单', 'normal', 'line', 16);
			}
		}

		/* ---------------- 命中 ---------------- */

		function tap(x, y) {
			if (overlay.on) {
				var midY = overlayTop();
				if (inside(x, y, W * 0.5 - 160, midY + 186, 320, 54)) {
					overlay = { on: false, title: '', sub: '' };
					startMatch(lastCfg);
					if (typeof t.onAgain === 'function') t.onAgain();
					return true;
				}
				if (inside(x, y, W * 0.5 - 160, midY + 256, 320, 52)) {
					if (typeof t.onExit === 'function') t.onExit();
					return true;
				}
				return true;
			}

			if (picker.on) {
				var gm = pickerGeom();
				var cells = pickerCells();
				var y0 = gm.y + 10 + 24;
				for (var i = 0; i < cells.length; i++) {
					var r = Math.floor(i / gm.cols);
					var c = i % gm.cols;
					var cx = gm.x + 8 + c * (gm.cw + 8);
					var cy = y0 + r * (gm.ch + 8);
					if (inside(x, y, cx, cy, gm.cw, gm.ch)) { choosePicker(i); return true; }
				}
				var byY = y0 + gm.rows * (gm.ch + 8) + 2;
				if (inside(x, y, gm.x + 8, byY, gm.w - 16, 44)) {
					if (picker.mode === 'swap') {
						picker.on = false;
						if (swapGate) swapGate.open = true;
						hint = '结算';
					} else {
						closePicker();
					}
					return true;
				}
				return true;
			}

			// 底部按钮
			if (inside(x, y, W * 0.5 + 10, lay.footY, 200, 46)) { surrender(); return true; }
			if (inside(x, y, W * 0.5 - 210, lay.footY, 200, 46)) {
				if (menuArmed > 0) { menuArmed = 0; if (typeof t.onExit === 'function') t.onExit(); }
				else { menuArmed = 2.5; hint = '再点一次「菜单」退出本局'; }
				return true;
			}

			if (busy || over || state === null) return false;

			// 主动技能条
			var list = chipList();
			if (list.length > 0) {
				var cg = chipGeom(list.length);
				for (var k = 0; k < list.length; k++) {
					var chx = cg.x0 + k * (cg.cw + 8);
					if (inside(x, y, chx, lay.skillBarY, cg.cw, lay.chipH)) {
						tapChip(list[k]);
						return true;
					}
				}
			}

			// 手牌
			for (var m = 0; m < hand.length; m++) {
				if (!inside(x, y, HAND_X + m * HAND_STEP, lay.handY, CW, CH)) continue;
				var act = Math.trunc(actions[m]);
				if (RC.legal_actions(state, 0).indexOf(act) < 0) return true;
				submit(act);
				return true;
			}
			return false;
		}

		/* ---------------- 对外 ---------------- */

		t.update = update;
		t.draw = draw;
		t.tap = tap;
		t.startMatch = startMatch;
		t.resize = function (nh, nTop, nBot) {
			H = nh || H;
			t.safeTop = nTop || 0;
			t.safeBottom = nBot || 0;
			recalc();
			for (var i = 0; i < seats.length; i++) {
				seats[i].cy = lay.cubeCy;
				seats[i].rad = lay.rad;
				seats[i].infoY = lay.cubeCy + lay.rad * 1.39 + 14;
			}
		};
		t.submitAction = function (a) { submit(a); };

		/* ---------------- 联机对外接口 ---------------- */

		/**
		 * 接入联机同步层。
		 * @param session g.WxNet.Session 实例
		 */
		t.attachNet = function (session) {
			net = { session: session, onEvent: null };
			netPending = false;
			netPeerAct = -1;
			netPeerIntent = null;
			/* 绝对座位：0 = 房主，1 = 加入方。本地永远把自己当 0 号，
			 * 这个值只用来在「双方同时发动」时裁决由谁生效。 */
			netMySeat = (session && Math.trunc(session.seat) === 1) ? 1 : 0;
			netReady = !!(session && session.st === 'ready');
			netBroken = false;
			netWait = 0;
			refreshAll();

			session.on = session.on || {};
			session.on.round = function (round, myAct, peerAct, intents) {
				netOnRound(round, myAct, peerAct, intents);
			};
			session.on.ready = function () {
				netReady = true;
				netStatus = '对手已接入';
				hint = '选择一张牌';
			};
			session.on.lost = function (why) {
				netReady = false;
				netStatus = '连接断开：' + why;
				hint = netStatus;
				/* 断线不能静默卡死：直接判负并回到菜单 */
				if (!over) {
					netBroken = true;
				}
			};
			session.on.desync = function (round, mine, peer) {
				logLine('第 ' + round + ' 回合不同步（' + mine.slice(0, 8) + ' ≠ ' + peer.slice(0, 8) + '）');
				netStatus = '检测到不同步';
			};
			return t;
		};

		t.isNet = function () { return !!net; };
		t.netPending = function () { return netPending; };
		t.netStatus = function () { return netStatus; };
		t.netBroken = function () { return netBroken; };

		/** 主动技能（联机时禁用那些「只有本地能算」的：调换、献祭、金身、禁豆） */
		t.setNet = function (on) {
			if (!on) { net = null; netPending = false; }
		};

		t.finish = function (wn) {
			co = null;
			anims = [];
			floats = [];
			fly = null;
			showResult(Math.trunc(wn));
		};
		t.debugUseSkill = function (id) {
			var list = chipList();
			for (var i = 0; i < list.length; i++) if (list[i].id === id) { tapChip(list[i]); return true; }
			return false;
		};
		/* 联机专用：直接按「已确认」的状态提交，跳过点按钮的坐标（测试用） */
		t.debugArmPierce = function () {
			if (!net) return false;
			pierceArmed = true;
			return submit(RC.Action.PASS);
		};
		t.debugArmGamble = function (card) {
			if (!net) return false;
			netGambleGuess = Math.trunc(card);
			return submit(RC.Action.PASS);
		};
		t.debugNetSeat = function () { return netMySeat; };
		t.debugChoose = function (i) { choosePicker(i); };
		t.debugState = function () { return state; };
		t.debugOver = function () { return over; };

			var seat = Math.trunc(net.session.seat) === 1 ? 1 : 0;
			var abs;
			if (winner === 0) abs = seat;
			else if (winner === 1) abs = 1 - seat;
			else if (winner === -2) abs = -2;
			else abs = -1;
			netCall('finish', { code: net.code, winner: abs }).then(function () {}, function () {});
		}

		function endNet() {
			if (!net) return;
			var n0 = net;
			net = null;
			try { n0.session.close('离开对局'); } catch (e) { /* 忽略 */ }
			try { n0.link.close('离开对局'); } catch (e2) { /* 忽略 */ }
		}

		/* ---------------- 前后台切换（手机上最要命的一段） ---------------- */

		var suppressLost = false;

		/**
		 * 切到后台（去微信粘房间码）。
		 * 浏览器这时不跑帧 → 不发心跳、不发 presence，
		 * 中继按 keepalive 把连接掐了，回来看门狗还会误判超时。
		 * 所以这里通知链路「暂停计时」，后台那段时间不算数。
		 */
		app.onSuspend = function () {
			if (net && net.link && net.link.suspend) net.link.suspend();
		};

		/**
		 * 回到前台。
		 *   · 链路还活着 → 什么都不用做，presence 会自动续上
		 *   · 链路断了   → 房间阶段按**同一个房间码**重连（好友还在等就能接回）
		 *   · 页面被回收重开了 → 走 main.js 里的 URL / 存档恢复
		 */
		app.onResume = function () {
			if (!net) return;
			if (net.link && net.link.resume) net.link.resume();
			if (!net) return;
			var ph = (net.link && net.link.phase) ? net.link.phase() : '';
			if (ph !== 'closed') return;

			var code = net.code;
			var role = net.role;
			suppressLost = true;
			try { endNet(); } finally { suppressLost = false; }

			if (screen === 'room') {
				if (role === 'host') resumeHost(code);
				else startJoin(code);
			} else {
				/* 牌桌阶段断线：牌桌自己会判负，这里不重复处理 */
				if (room) room.setStatus('连接断了，正在重连…', true);
			}
		};

		function setCount(c) {
			aiCount = clamp(c, 1, 3);
			showSetup();
		}

		function setLevel(row, lv) {
			if (row < 0 || row >= levels.length) return;
			levels[row] = clamp(lv, 1, 6);
			showSetup();
		}

		function togglePick(id) {
			var cur = picked().slice();
			var at = cur.indexOf(id);
			if (at >= 0) cur.splice(at, 1);
			else if (cur.length < SK.SLOTS) cur.push(id);
			setPick(cur);
			scrollY = clamp(scrollY, 0, maxScroll());
		}

		function randomPick() {
			var pool = SK.ALL_IDS.slice();
			for (var i = pool.length - 1; i > 0; i--) {
				var j = Math.floor(Math.random() * (i + 1));
				var tmp = pool[i];
				pool[i] = pool[j];
				pool[j] = tmp;
			}
			var out = [];
			var cnt = Math.min(SK.SLOTS, pool.length);
			for (var k = 0; k < cnt; k++) out.push(Math.trunc(pool[k]));
			setPick(out);
		}

		/* ---------------- 开局 ---------------- */

		function startMatch(cfg) {
			cfg = cfg || {};
			if (cfg.n !== undefined) aiCount = clamp(Math.trunc(cfg.n) - 1, 1, 3);
			if (cfg.levels) levels = cfg.levels.slice();
			if (cfg.loadoutP) playerSkills = cfg.loadoutP.slice();
			if (cfg.loadoutA) aiSkills = cfg.loadoutA.slice();

			var n = 1 + clamp(aiCount, 1, 3);
			var lv = [];
			for (var i = 0; i < n - 1; i++) lv.push(levels[i] === undefined ? 3 : levels[i]);

			screen = 'table';
			app.screen = 'table';
			var tb = g.WxTable.create({
				n: n,
				levels: lv,
				loadoutP: playerSkills,
				loadoutA: aiSkills,
				w: W,
				h: H,
				safeTop: app.safeTop,
				safeBottom: app.safeBottom,
			});
			tb.onExit = function () { table = null; showMenu(); };
			tb.onAgain = function () { /* 牌桌内部已重开，这里只同步状态 */ };
			tb.onShare = function () { table = null; showMenu(); };
			table = tb;
		}

		/* ---------------- 每帧 ---------------- */

		function update(dt) {
			/* 惯性滚动：抬手后继续滑一段，撞到两端即停 */
			if (fling !== 0 && screen === 'codex') {
				var before = scrollY;
				scrollY = clamp(scrollY + fling * dt, 0, maxScroll());
				if (scrollY === before) fling = 0;
				else {
					fling *= Math.pow(0.92, dt * 60);
					if (Math.abs(fling) < 30) fling = 0;
				}
			} else if (screen !== 'codex') {
				fling = 0;
			}

			if (screen === 'table' && table) {
				table.update(dt);
				return;
			}
			if (screen === 'room' && room) {
				room.update(dt);
				/* 进牌桌之前，握手/重传全靠这里驱动 —— 少了它，房主会一直停在
				 * 「等待对手加入」，因为没人去拉云端消息。 */
				if (net) {
					if (net.session && net.session.tick) net.session.tick(dt);
					if (net.link && net.link.tick) net.link.tick(dt);
				}
			}
		}

		function resize(nh, nTop, nBot) {
			H = nh;
			app.safeTop = nTop || 0;
			app.safeBottom = nBot || 0;
			relayout();
			if (table && table.resize) table.resize(H, app.safeTop, app.safeBottom);
			if (room && room.resize) room.resize(H, app.safeTop, app.safeBottom);
			scrollY = clamp(scrollY, 0, maxScroll());
		}

		/* ---------------- 绘制 ---------------- */

		function title(ctx, text, y, size) {
			S.textCenter(ctx, text, 0, y, W, size, S.C.INK);
		}

		function section(ctx, text, y) {
			S.text(ctx, text, 32, y + 13, 13, S.C.INK3);
		}

		function back(ctx, y) {
			S.textCenter(ctx, '‹ 返回', 24, y + 21 + 15 * 0.36, 96, 15, S.C.INK2);
		}

		function drawMenu(ctx) {
			title(ctx, '能量豆', menu.titleY, 58);
			S.textCenter(ctx, '简 约 版', 0, menu.subY + 13, W, 13, S.C.INK3);
			S.rule(ctx, W * 0.5 - 60, menu.ruleY, 120, S.C.LINE);

			S.button(ctx, W * 0.5 - 210, menu.btn1Y, 420, 62, 'AI 对 局', 'normal', 'solid', 19);
			S.button(ctx, W * 0.5 - 210, menu.btn2Y, 420, 62, '联 机 对 局', 'normal', 'solid', 19);
			S.button(ctx, W * 0.5 - 210, menu.btn3Y, 420, 52, '潜 能 图 鉴', 'normal', 'line', 16);

			S.textCenter(ctx, '六张牌 · 同时暗选 · 30 回合', 0, menu.footY - 22, W, 12, S.C.INK3);
			S.textCenter(ctx, 'AI 对局：1–3 名对手 · 6 档强度 · 30 种潜能', 0, menu.footY, W, 12, S.C.INK3);
		}

		/** 一个潜能清单面板：5 行，名字 + 说明 + 类型标记 */
		function drawLoadoutPanel(ctx, label, ids, y) {
			var h = setup.panelH;
			S.box(ctx, 32, y, W - 64, h, 12, S.C.BG, S.C.LINE, 1);
			S.text(ctx, label, 48, y + 26, 13, S.C.INK2);
			for (var i = 0; i < SK.SLOTS; i++) {
				var ry = y + 44 + i * 26;
				var id = (i < ids.length) ? Math.trunc(ids[i]) : -1;
				if (id < 0) {
					S.text(ctx, '—', 48, ry + 14, 13, S.C.LINE2);
					continue;
				}
				S.text(ctx, SK.name_of(id), 48, ry + 14, 13, S.C.INK);
				var tag = SK.is_once(id) ? '一次性' : (SK.cap_of(id) > 1 ? ('可叠 ' + SK.cap_of(id)) : '');
				if (tag) S.text(ctx, tag, W - 48, ry + 14, 11, S.C.INK3, 'right');
				var descW = W - 48 - 48 - 150 - (tag ? 60 : 0);
				S.text(ctx, clip(ctx, SK.desc_of(id), 11, descW), 168, ry + 14, 11, S.C.INK3);
			}
		}

		function drawSetup(ctx) {
			back(ctx, setup.backY);
			title(ctx, '对局设置', setup.titleY, 32);

			section(ctx, '对手数量', setup.sec1Y);
			for (var i = 0; i < 3; i++) {
				S.button(ctx, 32 + i * 122, setup.countY, 110, 46, String(i + 1), 'normal',
					aiCount === i + 1 ? 'chip-on' : 'line', 18);
			}

			section(ctx, '对手强度', setup.sec2Y);
			for (var row = 0; row < 3; row++) {
				if (row >= aiCount) continue;
				var ry = setup.row0Y + row * setup.rowStep;
				S.text(ctx, 'AI ' + (row + 1), 32, ry + 14 + 14, 14, S.C.INK2);
				for (var k = 0; k < 6; k++) {
					var on = Math.trunc(levels[row]) === k + 1;
					S.button(ctx, 104 + k * 104, ry, 98, 44, AIB_NAMES[k], 'normal',
						on ? 'chip-on' : 'line', 12);
				}
			}

			section(ctx, '潜能（各 ' + SK.SLOTS + ' 槽 · 同一潜能只能选一次）', setup.sec3Y);
			S.button(ctx, 32, setup.skillBtnY, 330, 52, '改我方潜能', 'normal', 'line', 16);
			S.button(ctx, W - 362, setup.skillBtnY, 330, 52, '改对手潜能', 'normal', 'line', 16);

			drawLoadoutPanel(ctx, '我方', playerSkills, setup.panelPY);
			drawLoadoutPanel(ctx, '对手', aiSkills, setup.panelAY);

			S.button(ctx, W * 0.5 - 220, setup.startY, 440, 66, '开 始 对 战', 'normal', 'solid', 20);
		}

		function drawSkillRow(ctx, id, y, on) {
			S.box(ctx, LIST_X, y, W - 48, ROW_H, 10, S.C.BG,
				on ? S.C.ACCENT : S.C.LINE, on ? 2 : 1);
			S.text(ctx, SK.name_of(id) + (on ? '   已选' : ''), LIST_X + 16, y + 14 + 17, 17,
				on ? S.C.ACCENT : S.C.INK);
			var tag = '';
			if (SK.is_once(id)) tag = ' · 一次性';
			else if (SK.cap_of(id) > 1) tag = ' · 可叠 ' + SK.cap_of(id);
			S.text(ctx, clip(ctx, SK.desc_of(id) + tag, 12, W - 48 - 32),
				LIST_X + 16, y + 42 + 12, 12, S.C.INK3);
		}

		function drawScrollBar(ctx) {
			var max = maxScroll();
			if (max <= 0) return;
			var vh = listViewH();
			var trackX = W - 14;
			var trackY = codex.listY;
			var hh = Math.max(40, vh * (vh / listContentH()));
			var p = scrollY / max;
			ctx.save();
			ctx.fillStyle = S.C.LINE2;
			ctx.fillRect(trackX, trackY + (vh - hh) * p, 2, hh);
			ctx.restore();
		}

		function drawCodex(ctx) {
			var pick = !!app.codexPick;
			back(ctx, codex.backY);
			title(ctx, pick ? '选 择 潜 能' : '潜 能 图 鉴', codex.titleY, 30);

			var hint = pick
				? ('已选 ' + picked().length + ' / ' + SK.SLOTS + ' · 点一下选中，再点取消 · 可上下拖动')
				: ('共 ' + SK.ALL_IDS.length + ' 项 · 上下拖动浏览');
			S.textCenter(ctx, hint, 0, codex.hintY + 12, W, 12, S.C.INK3);

			var viewH = listViewH();
			ctx.save();
			ctx.beginPath();
			ctx.rect(LIST_X, codex.listY, W - 48, viewH);
			ctx.clip();
			var ids = SK.ALL_IDS;
			for (var i = 0; i < ids.length; i++) {
				var y = codex.listY - scrollY + i * ROW_STEP;
				if (y + ROW_H < codex.listY - 1 || y > codex.listY + viewH + 1) continue;
				var id = Math.trunc(ids[i]);
				drawSkillRow(ctx, id, y, pick && picked().indexOf(id) >= 0);
			}
			ctx.restore();
			drawScrollBar(ctx);

			if (pick) {
				S.rule(ctx, 32, codex.barLineY, W - 64, S.C.LINE);
				S.button(ctx, 32, codex.btnY, 150, 46, '随机', 'normal', 'line', 15);
				S.button(ctx, 196, codex.btnY, 150, 46, '清空', 'normal', 'line', 15);
				S.button(ctx, W - 242, codex.btnY - 3, 210, 52, '完 成', 'normal', 'solid', 16);
			}
		}

		function draw(ctx) {
			if (screen === 'table' && table) {
				table.draw(ctx);
				return;
			}
			ctx.save();
			ctx.fillStyle = S.C.BG;
			ctx.fillRect(0, 0, W, H);
			ctx.restore();

			if (screen === 'menu') drawMenu(ctx);
			else if (screen === 'setup') drawSetup(ctx);
			else if (screen === 'codex') drawCodex(ctx);
			else if (screen === 'room' && room) room.draw(ctx);
		}

		/* ---------------- 命中 ---------------- */

		function codexRowAt(x, y) {
			if (!inside(x, y, LIST_X, codex.listY, W - 48, listViewH())) return -1;
			var rel = y - codex.listY + scrollY;
			var i = Math.floor(rel / ROW_STEP);
			if (i < 0 || i >= SK.ALL_IDS.length) return -1;
			if (rel - i * ROW_STEP > ROW_H) return -1;
			return i;
		}

		function tap(x, y) {
			if (screen === 'table') {
				if (table) table.tap(x, y);
				return true;
			}

			if (screen === 'menu') {
				if (inside(x, y, W * 0.5 - 210, menu.btn1Y, 420, 62)) { showSetup(); return true; }
				if (inside(x, y, W * 0.5 - 210, menu.btn2Y, 420, 62)) { showRoom(); return true; }
				if (inside(x, y, W * 0.5 - 210, menu.btn3Y, 420, 52)) { showCodex(false, 0, 'menu'); return true; }
				return false;
			}

			if (screen === 'room') {
				if (room) room.tap(x, y);
				return true;
			}

			if (screen === 'setup') {
				if (inside(x, y, 24, setup.backY, 96, 42)) { showMenu(); return true; }
				for (var i = 0; i < 3; i++) {
					if (inside(x, y, 32 + i * 122, setup.countY, 110, 46)) { setCount(i + 1); return true; }
				}
				for (var row = 0; row < 3; row++) {
					if (row >= aiCount) continue;
					var ry = setup.row0Y + row * setup.rowStep;
					for (var k = 0; k < 6; k++) {
						if (inside(x, y, 104 + k * 104, ry, 98, 44)) {
							setLevel(row, k + 1);
							return true;
						}
					}
				}
				if (inside(x, y, 32, setup.skillBtnY, 330, 52)) { showCodex(true, 0); return true; }
				if (inside(x, y, W - 362, setup.skillBtnY, 330, 52)) { showCodex(true, 1); return true; }
				if (inside(x, y, W * 0.5 - 220, setup.startY, 440, 66)) {
					startMatch({
						n: 1 + aiCount, levels: levels, loadoutP: playerSkills, loadoutA: aiSkills,
					});
					return true;
				}
				return false;
			}

			if (screen === 'codex') {
				var pick = !!app.codexPick;
				var backTo = function () {
					if (!pick) { showMenu(); return; }
					if (codexReturn === 'room') showRoom(); else showSetup();
				};
				if (inside(x, y, 24, codex.backY, 96, 42)) { backTo(); return true; }
				if (pick) {
					if (inside(x, y, 32, codex.btnY, 150, 46)) { randomPick(); return true; }
					if (inside(x, y, 196, codex.btnY, 150, 46)) { setPick([]); return true; }
					if (inside(x, y, W - 242, codex.btnY - 3, 210, 52)) { backTo(); return true; }
				}
				var i2 = codexRowAt(x, y);
				if (i2 >= 0) {
					if (pick) togglePick(Math.trunc(SK.ALL_IDS[i2]));
					return true;
				}
				return false;
			}
			return false;
		}

		/* ---------------- 对外 ---------------- */

		app.update = update;
		app.draw = draw;
		app.tap = tap;
		app.resize = resize;
		app.showMenu = showMenu;
		app.showSetup = showSetup;
		app.showCodex = showCodex;
		app.showRoom = showRoom;
		app.joinByCode = joinByCode;
		app.resumeHost = resumeHost;
		app.lastRoom = lastRoom;
		app.forgetRoom = forgetRoom;
		app.startMatch = startMatch;
		app.safeTop = TOP;
		app.safeBottom = opts.safeBottom || 0;
		app.debugSubmit = function (a) { if (table) table.submitAction(a); };
		app.debugFinish = function (wn) { if (table) table.finish(wn); };
		app.debugTable = function () { return table; };
		app.debugRoom = function () { return room; };
		app.debugNet = function () { return net; };
		app.debugScreen = function () { return screen; };
		app.debugMenu = function () { return menu; };
		app.debugSetup = function () { return setup; };
		app.debugCodex = function () {
			return {
				scrollY: scrollY, maxScroll: maxScroll(), fling: fling,
				listY: codex.listY, listBottom: codex.listBottom, viewH: listViewH(),
				contentH: listContentH(), pick: !!app.codexPick,
			};
		};

		/* 拖拽滚动（潜能列表）
		 *
		 * 手机上手指很难精确压在列表框内，所以整个潜能页都接受竖向拖拽 ——
		 * 只要列表真能滚（maxScroll > 0）就接住。点击不受影响：platform 里
		 * 「手指没动过」才算 tap，动过就只当滚动。
		 * 抬手时按最后一段的速度留一点惯性，手感更像原生列表。 */
		function nowMs() {
			return (g.WxPlatform && g.WxPlatform.now) ? g.WxPlatform.now() : 0;
		}

		app.touchStart = function (x, y) {
			if (screen !== 'codex') return false;
			fling = 0;
			dragging = maxScroll() > 0;
			dragStartY = y;
			dragStartScroll = scrollY;
			dragLastY = y;
			dragLastT = nowMs();
			return dragging;
		};
		app.touchMove = function (x, y) {
			if (!dragging) return false;
			scrollY = clamp(dragStartScroll + (dragStartY - y), 0, maxScroll());
			var t = nowMs();
			var dt = (t - dragLastT) / 1000;
			if (dt > 0.004) {
				var v = (dragLastY - y) / dt;      // 向上滑为正
				fling = fling * 0.4 + v * 0.6;
				dragLastY = y;
				dragLastT = t;
			}
			return true;
		};
		app.touchEnd = function () {
			dragging = false;
			if (Math.abs(fling) < 200) fling = 0;  // 慢慢挪的不给惯性
		};
		app.scrollBy = function (dy) {
			fling = 0;
			scrollY = clamp(scrollY + dy, 0, maxScroll());
		};
		/** 桌面滚轮：一行约 16 逻辑像素，和拖拽同一条 clamp 路径 */
		app.wheel = function (dy) {
			fling = 0;
			scrollY = clamp(scrollY + dy * 0.6, 0, maxScroll());
			return screen === 'codex';
		};

		app.codexPick = false;
		app.screen = 'menu';

		relayout();
		showMenu();
		return app;
	}

	g.WxApp = { create: create };
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
<script>
/**
 * 运行时入口（浏览器 / 微信小游戏共用）
 *
 * 只做四件事：拿到宿主画布、建 App、把帧循环跑起来、把输入转成逻辑坐标。
 * 画面全部由 js/ui/*.js 绘制，这里不含任何业务逻辑。
 *
 * 平台的差异全部收在 js/platform.js，本文件对两个宿主是同一份代码。
 */
(function (g) {
	'use strict';

	var booted = false;

	function boot() {
		if (booted) return;
		booted = true;

		var P = g.WxPlatform;
		if (!P) throw new Error('缺少 js/platform.js');
		P.init();

		// 云开发（联机用）：环境 ID 在 minigame/cloud.config.js 里填。
		// 没填 / 没开通 / 在浏览器里跑，都只是 WX_CLOUD_READY = false，单机不受影响。
		var env = String(g.WX_CLOUD_ENV || '');
		g.WX_CLOUD_READY = false;
		if (P.isWx && env && g.wx && g.wx.cloud) {
			try {
				g.wx.cloud.init({ env: env, traceUser: true });
				g.WX_CLOUD_READY = true;
			} catch (e) {
				g.WX_CLOUD_READY = false;
			}
		}
		g.WX_CLOUD_ENV = env;

		var v = P.view;
		var app = g.WxApp.create(v.w, v.h, {
			safeTop: v.safeTop,
			safeBottom: v.safeBottom,
		});
		g.WxApp.current = app;

		/* 好友点分享卡片进来：query 里带房间码，直接替他进房，不用手输 */
		var invite = P.launchCode ? P.launchCode() : '';
		if (invite && app.joinByCode) app.joinByCode(invite);
		if (P.onInvite) {
			P.onInvite(function (code) {
				if (app.joinByCode) app.joinByCode(code);
			});
		}

		/* 网页版：地址栏里可能带着上次的房间码（#code=XXXX&role=host）。
		 * 手机上「复制房间码 → 切到微信 → 回来」这一步，页面经常被系统回收重开，
		 * 靠这一行就能接回同一局，而不是从头再来。 */

		if (urlRoom && urlRoom.code) {

			else if (app.joinByCode) app.joinByCode(urlRoom.code);

			dragStart: function (x, y) { return app.touchStart(x, y); },

			dragEnd: function () { app.touchEnd(); },

			g.addEventListener('resize', function () {
				if (t) clearTimeout(t);
				t = setTimeout(function () {

					app.resize(nv.h, nv.safeTop, nv.safeBottom);

		/* 前后台切换：手机上「复制房间码 → 切微信 → 回来」必经的一段。
		 * 切走时通知网络层暂停计时（后台不跑帧，看门狗会误判超时），
		 * 回来时让它按「刚回来」重新判断链路状态，必要时自动重连。 */

			function () { if (app.onResume) app.onResume(); },
			function () { if (app.onSuspend) app.onSuspend(); }

			P.share({ title: '能量豆对战 · 六张牌的猜拳博弈' });

<script>
(function () {
	var box = document.getElementById('__boot');

	function fail(title, msg) {
		if (!box) { alert(title + '\n\n' + msg); return; }
		box.style.display = 'block';
		box.innerHTML = '';
		var b = document.createElement('b');
		b.textContent = title;
		box.appendChild(b);
		box.appendChild(document.createTextNode(msg));
	}

	window.addEventListener('error', function (e) {
		if (e && e.message) fail('游戏启动失败', e.message + '\n' + ((e.filename || '') + ':' + (e.lineno || 0)));
	});

	// 同目录的 js/ 没跟着一起拷过去（手机上最常见）：别再只留一个白框，
	// 直接说清楚该打开哪个文件。
	if (typeof WxMain === 'undefined') {
		fail('少了 js 目录',
			'你现在打开的是 index.html，它要靠同目录下的 js/ 那 22 个文件才能运行。\n' +
			'单独把这一个 html 拷到手机上，脚本全部加载不到，所以只剩一个白框。\n\n' +
			'手机上请打开「能量豆对战.html」（或 game.html）—— 那是单文件版，' +
			'所有脚本都内联在里面，双击就能玩，不需要 js 目录。');
		return;
	}

	try {
		WxMain.boot();
	} catch (err) {
		fail('游戏启动失败', (err && err.stack) ? err.stack : String(err));
	}
})();
</script>
